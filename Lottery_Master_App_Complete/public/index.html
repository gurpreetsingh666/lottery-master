/* Improved receipt scanner: on-device OCR with overlapping cropped sections. */
async function posReadImageWithFallback(file){
 await posLoadLibrary('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',()=>!!window.Tesseract);
 const worker=await window.Tesseract.createWorker('eng');
 let bitmap=null,photoUrl='';
 try{
  if(typeof createImageBitmap==='function'){try{bitmap=await createImageBitmap(file)}catch(e){}}
  if(!bitmap){
   photoUrl=URL.createObjectURL(file);
   bitmap=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('Photo could not be opened.'));img.src=photoUrl});
  }
  const iw=bitmap.width,ih=bitmap.height;
  if(!iw||!ih)throw Error('Photo dimensions could not be read.');
  await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
  const regions=iw>=ih?[[0,0,1,1]]:[[0,.12,1,.43],[0,.46,1,.46],[0,0,1,.38],[0,.70,1,.30],[0,0,1,1]];
  let best='',bestScore=-1,bestRegion=null;
  for(let i=0;i<regions.length;i++){
   const [rx,ry,rw,rh]=regions[i];
   const x=Math.round(iw*rx),y=Math.round(ih*ry);
   const w=Math.min(iw-x,Math.max(1,Math.round(iw*rw))),h=Math.min(ih-y,Math.max(1,Math.round(ih*rh)));
   const scale=Math.min(2.5,Math.max(1,1700/w),2400/w,2900/h);
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
   const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw Error('Image processing unavailable.');
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
   ctx.drawImage(bitmap,x,y,w,h,0,0,canvas.width,canvas.height);
   posNote='Reading Department 24: checking photo section '+(i+1)+' of '+regions.length+'…';
   const label=document.getElementById('posNote');if(label)label.textContent=posNote;
   const recognized=(await worker.recognize(canvas))?.data?.text||'';
   if(posParse(recognized).length){canvas.width=canvas.height=0;return recognized}
   const score=(/(?:24|2A|Z4)\s+[Ii1l|!]NSTANT/i.test(recognized)?10000:0)+recognized.length;
   if(score>bestScore){best=recognized;bestScore=score;bestRegion=[x,y,w,h]}
   canvas.width=canvas.height=0;
  }
  if(bestRegion){
   const [x,y,w,h]=bestRegion;
   const scale=Math.min(2.5,Math.max(1,1750/w),2350/w,2900/h);
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
   const ctx=canvas.getContext('2d',{willReadFrequently:true});
   if(ctx){
    ctx.filter='grayscale(1) contrast(1.7)';
    ctx.drawImage(bitmap,x,y,w,h,0,0,canvas.width,canvas.height);
    await worker.setParameters({tessedit_pageseg_mode:'11'});
    posNote='Final enhanced scan for the Department 24 row…';
    const label=document.getElementById('posNote');if(label)label.textContent=posNote;
    const second=(await worker.recognize(canvas))?.data?.text||'';
    if(posParse(second).length){canvas.width=canvas.height=0;return second}
    if((/(?:24|2A|Z4)\s+[Ii1l|!]NSTANT/i.test(second)?10000:0)+second.length>bestScore)best=second;
   }
   canvas.width=canvas.height=0;
  }
  return best;
 }finally{
  try{await worker.terminate()}catch(e){}
  if(bitmap&&typeof bitmap.close==='function')bitmap.close();
  if(photoUrl)URL.revokeObjectURL(photoUrl);
 }
}
async function posReadFile(f){
 const ext=f.name.toLowerCase();if(/\.(csv|tsv|txt)$/.test(ext)||f.type.startsWith('text/'))return f.text();
 if(ext.endsWith('.pdf')||f.type==='application/pdf'){
 const url='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
 await posLoadLibrary(url+'pdf.min.js',()=>!!window.pdfjsLib);
 window.pdfjsLib.GlobalWorkerOptions.workerSrc=url+'pdf.worker.min.js';
 const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let text='';
 for(let i=1;i<=Math.min(15,pdf.numPages);i++){const p=await pdf.getPage(i),content=await p.getTextContent();let previousY=null;for(const item of content.items){const y=item.transform?.[5];if(previousY!==null&&Number.isFinite(y)&&Math.abs(y-previousY)>2)text+='\n';text+=(item.str||'')+' ';if(Number.isFinite(y))previousY=y;if(item.hasEOL){text+='\n';previousY=null}}text+='\n'}
 if(!text.trim())throw Error('Scanned PDF has no readable text. Try a photo or CSV.');
 return text
 }

 }
 throw Error('Upload CSV, TXT, PDF, PNG or JPG')
}

const oldPosParseScan=posParse;
function posMoneyCells(line) {
  const clean=String(line||"").replace(/\u00a0/g," ")
     .replace(/(\d)[Oo](?=\d{1,2}\b)/g,"$10")

function posIsDepartment24(line) {
  const text=String(line||"").toUpperCase().replace(/[\u00a0\t]/g," ")
    .replace(/\b[1I|]N[S5]TANT\b/g,"INSTANT")
    .replace(/IN[S5]TANT/g,"INSTANT").replace(/INST\s+ANT/g,"INSTANT");
  return /^\s*(?:24|2A|2\s*4)\s*[:.\-|]?\s*INSTANT(?:\s*[/\\|]?\s*[LI1])?(?![A-Z])/i.test(text);
}
function posParseEnhanced(text) {
  const lines=String(text||"").replace(/\r/g,"\n").split(/\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  const found=[];
  for(let i=0;i<lines.length;i++) {
    const first=lines[i],split=/^\s*24\s*$/.test(first)&&!!lines[i+1],combined=split?first+" "+lines[i+1]:first;
    if(!posIsDepartment24(combined))continue;
    let values=posMoneyCells(combined.replace(/^\s*(?:24|2A|2\s*4)\s*[:.\-|]?\s*INSTANT\s*[/\\|]?\s*[LI1]?\s*/i,""));
    let endIndex=i;

      for(let j=i+(split?2:1);j<Math.min(lines.length,i+5);j++){
        if(/^\s*\d{1,3}\s+[A-Z]/i.test(lines[j])||posIsDepartment24(lines[j]))break;
        const nextValues=posMoneyCells(lines[j]);
        if(nextValues.length>=4){values=nextValues;endIndex=j;break}
        if(nextValues.length&&values.length+nextValues.length<=4){values=values.concat(nextValues);endIndex=j}

    found.push({departmentNumber:24,departmentName:"INSTANT/L",gross,refund,discount,net,
      customers:null,items:null,share:null,line:lines.slice(i,endIndex+1).join(" | ").slice(0,350)});

  const missing=[],fail=[],exceptions=[];
  for(const x of p.required){
    const key=packExceptionKey(x.si,x.ri),r=row(x.si,x.ri),entry=p.scanned[key];
    if(!entry){missing.push(x);continue}
    if(entry.exception){
      const record=sh.packScanExceptions?.[key];
      if(!record||!r||r.binEmpty||record.scannedPack!==entry.pack||
         record.scannedGame!==entry.game||record.end!==entry.end||
         String(r.packNumber||"")!==record.expectedPack||
         String(r.gameNumber||"")!==record.expectedGame){
        fail.push(explainBin(x.si,x.ri)+" mismatch scan changed; rescan.");
      }else exceptions.push(record);
      continue;
    }
    if(!r||r.binEmpty||safeNum(r.end)!==entry.end||
       String(r.gameNumber||"")!==entry.game||String(r.packNumber||"")!==entry.pack){
      fail.push(explainBin(x.si,x.ri)+" changed since scan");continue;
    }
    const start=effectiveStart(data.current,x.si,x.ri);
    if(start===null||!Number.isSafeInteger(start)||start<entry.end){
      fail.push(explainBin(x.si,x.ri)+" needs a valid Start #");
    }
  }
  return {missing,fail,error:null,exceptions};
};

/* Reliable shift rollover:
   - A submitted Night shift (9 PM - 9 AM) starts Day on the following date.
   - A submitted Day shift starts Night on the same date.
   - Prevent blank/duplicate shift creation, keep historical reports unchanged,
     and persist the new shift before announcing success.
*/
let nextShiftStartBusy=false;
function rolloverShiftMatch(type,date){
  return data.sheets.findIndex(s=>s.shiftType===type&&(s.shiftCloseDate||s.date)===date);
}
async function rolloverPersist(){
  try{
    await idbSet(data);
    return true;
  }catch(e){
    try{
      localStorage.setItem(KEY,JSON.stringify(data));
      return true;
    }catch(other){return false}
  }
}
function rolloverCreateSections(previous){
  // Maintain all ticket identities, photos and prices. Never copy the previous
  // shift's sales/end values into the next shift.
  return previous.sections.map((rows,si)=>rows.map((r,ri)=>{
    const saved=savedTicketSetup(si,ri);
    return {...r,
      ticketName:saved.ticketName??r.ticketName??'',
      price:safeNum(saved.price)??safeNum(r.price),
      photoId:saved.photoId||r.photoId||null,
      start:null,end:null,overrideStart:false,binEmpty:false,
      soldOutUndo:null,closures:[],lastScanSerial:null,endSource:null
    };
  }));
}
shiftSaveNext=async function(){
  if(nextShiftStartBusy)return;
  const sh=sheet(),previousIndex=data.current;
  if(!sh?.closedAt){
    showToast("Finish End Shift → Scan → Submit before starting the next shift.");
    return;
  }
  const expected=shiftNextSuggested(sh);
  const type=$("flowNextType")?.value||expected.type,
        date=$("flowNextDate")?.value||expected.date;
  if(!SHIFT_TIMES[type]||!/^\d{4}-\d{2}-\d{2}$/.test(date||"")){
    showToast("Choose Day/Night and a valid shift start date.");
    return;
  }
  if(type!==expected.type||date!==expected.date){
    if(!confirm("Normally the next shift is "+expected.type+" starting "+expected.date+
     ". Start "+type+" on "+date+" instead?"))return;
  }
  nextShiftStartBusy=true;
  const button=$("flowNextStart");
  if(button){button.disabled=true;button.textContent="Starting shift…"}
  try{
    const existing=rolloverShiftMatch(type,date);
    if(existing>=0){
      data.current=existing;section=0;query="";
      const matched=sheet();
      if(!matched.startedAt&&!matched.closedAt){
        matched.startedAt=new Date().toISOString();
        matched.shiftStartTime=SHIFT_TIMES[type].start;
        matched.shiftEndTime=SHIFT_TIMES[type].end;
      }
      const saved=await rolloverPersist();
      if(!saved){data.current=previousIndex;showToast("Could not save. Check storage and try again.");render();return}
      shiftClosePending=null;saveSoon();render();
      showToast(type+" "+date+" opened. Existing shift reused — no duplicate created.");
      return;
    }
    if(previousIndex!==data.sheets.length-1){
      const newer=data.sheets.length-1;
      data.current=newer;section=0;
      render();
      showToast("A newer shift already exists. Opened your latest shift; no duplicate created.");
      return;
    }
    const sections=rolloverCreateSections(sh),n=data.sheets.length+1;
    const startedAt=new Date().toISOString();
    const next={id:"sheet-"+Date.now()+"-"+n,name:type+" · "+date,
      date,shiftCloseDate:date,shiftType:type,
      shiftStartTime:SHIFT_TIMES[type].start,shiftEndTime:SHIFT_TIMES[type].end,
      startedAt,sections};
    // Store the fully-formed next shift in a single operation: addSheet(false)
    // rendered a blank interim sheet before assigning its shift metadata.
    data.sheets.push(next);
    data.current=data.sheets.length-1;
    section=0;query="";
    if(!await rolloverPersist()){
      data.sheets.pop();data.current=previousIndex;
      render();showToast("Could not save the new shift. Nothing changed; please try again.");return;
    }
    shiftClosePending=null;
    saveSoon();
    render();
    showToast("✓ "+type+" started for "+date+". Previous shift report remains closed.");
  }catch(e){
    // If anything unexpected happens, leave no unverified new shift behind.
    const last=data.sheets[data.sheets.length-1];
    if(last?.startedAt&&last.shiftType===type&&last.shiftCloseDate===date&&
       data.sheets.length===previousIndex+2){
      data.sheets.pop();
    }
    data.current=previousIndex;
    try{render()}catch(err){}
    showToast("Start Next Shift could not complete. Your previous shift is still saved.");
  }finally{
    nextShiftStartBusy=false;
  }
};

/* Indiana store-local shift dates, actual start time, and a clear report date.
   Never infer a new shift's start date from an old, unstarted sheet date. */
const STORE_SHIFT_TIME_ZONE="America/Indiana/Indianapolis";
function shiftStoreClock(instant=new Date()){
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:STORE_SHIFT_TIME_ZONE,
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hourCycle:"h23"
  }).formatToParts(instant);
  const read=k=>parts.find(p=>p.type===k)?.value||"";
  return {date:read("year")+"-"+read("month")+"-"+read("day"),hour:Number(read("hour")),minute:Number(read("minute"))};
}
function shiftStoreSuggestedStart(type,instant=new Date()){
  const clock=shiftStoreClock(instant);
  // A Night Shift starting at 9 PM stays on the PREVIOUS day's report
  // until the following 9 AM. Day starts on the current calendar day.
  return type==="Night Shift"&&clock.hour<9
    ?shiftDatePlusDays(clock.date,-1):clock.date;
}
function shiftStoreActualStart(iso){
  const t=new Date(iso);
  if(!iso||!Number.isFinite(t.valueOf()))return "Not recorded";
  return new Intl.DateTimeFormat("en-US",{
    timeZone:STORE_SHIFT_TIME_ZONE,year:"numeric",month:"short",day:"numeric",
    hour:"numeric",minute:"2-digit",hour12:true
  }).format(t)+" Indiana time";
}

/* Recover from a shift that was started by mistake.
   Resume is always safe. Undo Start is permitted only on an empty,
   still-open shift, never when scans, totals, or inventory moves exist. */
let shiftUndoStartBusy=false;
function shiftActiveIndices(){
 return (data?.sheets||[]).map((sh,i)=>sh&&sh.startedAt&&!sh.closedAt?i:-1).filter(i=>i>=0);
}
function shiftStartHasWork(index){
 const sh=data?.sheets?.[index];if(!sh)return true;
 if(sh.closedAt||sh.scannedAtClose||sh.closeMethod)return true;
 if(Object.values(sh.packScanExceptions||{}).some(Boolean))return true;
 if(Array.isArray(sh.correctionHistory)&&sh.correctionHistory.length)return true;
 if((data.posReports||[]).some(p=>p&&p.sheetId===sh.id))return true;
 const st=scannerState();
 if((st.history||[]).some(h=>h&&h.sheetId===sh.id))return true;
 if((data.scanner?.history||[]).some(h=>h&&h.sheetId===sh.id))return true;
 for(const rows of sh.sections||[]){
  for(const r of rows||[]){
   if(!r)continue;
   if(safeNum(r.start)!==null||safeNum(r.end)!==null||r.overrideStart||r.binEmpty||
      r.soldOutUndo||r.lastScanSerial||r.endSource||
      (Array.isArray(r.closures)&&r.closures.length)>0)return true;
  }
 }
 return false;
}
function shiftResume(index=shiftActiveIndices().at(-1)){
 if(!Number.isInteger(index)||index<0||!shiftIsActive(data.sheets[index])){
   showToast("No active shift found. Open Shifts to start a shift.");return;
 }
 data.current=index;section=0;query="";
 saveSoon();setView("sheets");
 showToast("✓ Active "+shiftHistLabel(sheet())+" opened. Continue ticket scanning or press End Shift when ready.");
}
async function shiftUndoAccidentalStart(){
 if(shiftUndoStartBusy)return;
 const sh=sheet(),index=data.current;
 if(!shiftIsLatest()||!sh?.startedAt||sh.closedAt){
   showToast("Only the newest active shift can have an accidental start undone.");return;
 }
 if(shiftStartHasWork(index)){
   showToast("This shift has saved activity. Its start cannot be undone; use Correct Shift Label / Report Date instead.");
   return;
 }
 if(!confirm("Undo the accidental Start Shift for "+shiftHistLabel(sh)+"?\\n\\nThis shift has no recorded ticket activity. "+
   "Its started status will be reset so you can choose the correct Day/Night shift and date. "+
   "Ticket photos, game names, inventory, sales, and previous closed reports stay unchanged."))return;
 shiftUndoStartBusy=true;
 const backup={startedAt:sh.startedAt,startTimeZone:sh.startTimeZone,name:sh.name,shiftType:sh.shiftType,
   shiftCloseDate:sh.shiftCloseDate,shiftStartTime:sh.shiftStartTime,shiftEndTime:sh.shiftEndTime,date:sh.date,
   startUndoHistory:sh.startUndoHistory};
 try{
   const now=shiftStoreClock().date;
   sh.startUndoHistory=[...(Array.isArray(sh.startUndoHistory)?sh.startUndoHistory:[]),
     {at:new Date().toISOString(),previousType:backup.shiftType||"",previousDate:backup.shiftCloseDate||backup.date||"",reason:"User undid accidental shift start before any scan"}];
   delete sh.startedAt;delete sh.startTimeZone;
   delete sh.shiftType;delete sh.shiftCloseDate;
   delete sh.shiftStartTime;delete sh.shiftEndTime;

function recordedShiftEndings() {
  const required=guideList(0,0).map(({si,ri})=>({si,ri})),ready=[],missing=[];
  for(const x of required) {
    const r=row(x.si,x.ri),check=safeEndRange(x.si,x.ri,r?.end);
    if(check.error)missing.push({...x,error:check.error});
    else ready.push({...x,end:check.end});
  }
  return {required,ready,missing};
}
function prepareRecordedShiftEndings() {
  const sh=sheet(),summary=recordedShiftEndings();
  if(!shiftClosePending||shiftClosePending.sheetId!==sh.id)
    shiftClosePending={sheetId:sh.id,required:[],scanned:{}};
  const prior=shiftClosePending.scanned||{},scanned={};
  shiftClosePending.required=summary.required;
  for(const x of summary.ready){
    const r=row(x.si,x.ri),key=x.si+'-'+x.ri;
    const game=String(r.gameNumber||''),pack=String(r.packNumber||''),existing=prior[key];
    scanned[key]=existing&&existing.end===x.end&&existing.game===game&&existing.pack===pack
      ?existing:{game,pack,end:x.end,at:new Date().toISOString(),source:'saved-sheet'};
  }
  shiftClosePending.scanned=scanned;

}

/* Each newly created Day/Night shift snapshots its previous BIN ending values.

const rolloverSectionsBeforeCarry = rolloverCreateSections;
rolloverCreateSections = function(previous) {
  const sections = rolloverSectionsBeforeCarry(previous);
  sections.forEach((rows, si) => rows.forEach((next, ri) => {
    const old = previous.sections?.[si]?.[ri];
    const n = old?.binEmpty ? null : safeNum(old?.end);
    const previousEnd = n !== null && Number.isSafeInteger(n) && n >= 0 ? n : null;
    next.carriedStartNumber = previousEnd;
    next.startFromPreviousShift = true;
    next.carriedStartFromSheetId = previous.id || null;
    next.start = null;  // The displayed Start # is the saved carriedStartNumber.
    next.overrideStart = false; // Manual Start stays available for replaced packs.
    next.end = null; // Never copy sales/ending values into the new shift.
  }));
  return sections;
};
const effectiveStartBeforeCarry = effectiveStart;
effectiveStart = function(sheetIndex, si, ri) {
  const r = data.sheets[sheetIndex]?.sections?.[si]?.[ri];
  if(r?.startFromPreviousShift && !r.overrideStart)
    return safeNum(r.carriedStartNumber);
  return effectiveStartBeforeCarry(sheetIndex, si, ri);
};

let closeAndAdvanceBusy=false;

    shiftCloseReview();

    return;
  }

    showToast('Open the latest active shift before closing it. Historical shifts will stay unchanged.');
    return;
  }
  if(shiftActiveIndices().some(i=>i!==previousIndex)){
    showToast('More than one active shift exists. Resolve the other active shift before advancing.');
    return;
  }
  const nextInfo=shiftNextSuggested(sh);
  const existing=rolloverShiftMatch(nextInfo.type,nextInfo.date);
  if(existing>=0&&existing!==previousIndex){
    showToast('A shift with the next Day/Night date already exists. Open it from shift history; no duplicate was created.');
    return;
  }

    '\n\n'+count+' BIN ending numbers were checked.'+
    '\n\nA NEW '+nextInfo.type+' shift ('+nextInfo.date+') will open automatically.'+
    '\nThe old shift End # becomes the new shift Start # for each BIN, including #0.'+
    '\nNew End # fields will be empty. Your closed report and inventory history will be preserved.';
  if(!confirm(message))return;
  closeAndAdvanceBusy=true;
  const btn=$('shiftSubmitVerified');
  if(btn){btn.disabled=true;btn.textContent='Closing & starting next shift…';}
  const oldClose={
    closedAt:sh.closedAt,closeMethod:sh.closeMethod,
    scannedAtClose:sh.scannedAtClose,shiftCloseDate:sh.shiftCloseDate
  };
  let added=null,committed=false;
  try{
    sh.closedAt=new Date().toISOString();
    sh.closeMethod=p.required.some(x=>p.scanned[x.si+'-'+x.ri]?.source==='saved-sheet')
      ?'verified-saved-endings':'verified-bin-scans';
    sh.scannedAtClose=count;

      id:'sheet-'+Date.now()+'-'+n,

      data.current=previousIndex;
      for(const [k,v] of Object.entries(oldClose)){

    }

  }finally{
    closeAndAdvanceBusy=false;
    if(btn?.isConnected){btn.disabled=false;btn.textContent='✓ Submit & close shift';}
  }
  // Save was successful: keep the closed report and move the active selection forward.
  const newIndex=data.current;
  try{

  }catch(e){}finally{data.current=newIndex;}
  shiftClosePending=null;
  try{if(cameraRunning)await stopCamera()}catch(e){}
  saveSoon();
  setView('sheets');
  const numberOfStarts=(added.sections||[]).flat()
    .filter(r=>r?.startFromPreviousShift&&safeNum(r.carriedStartNumber)!==null).length;
  showToast('✓ '+nextInfo.type+' opened. '+numberOfStarts+
    ' BIN Start # values carried forward from the closed shift. New End # fields are blank.');
};

  forwardShiftBusy=false;
  // Avoid automatic downloadPdfReport() here: on mobile this opens the OLD report.
  // The user can download historical reports from the normal PDF button.
  try{if(cameraRunning)await stopCamera()}catch(e){}
  const target=data.sheets.findIndex(s=>s===created);
  if(target<0){showToast('Saved new shift. Open the latest shift in the sheet selector.');return;}

/* Close an older active shift and hand off to the correct next Day/Night sheet.
   An existing matching sheet is reused; recorded work is never overwritten. */
let closeHistoryBusy=false;
function closeHistoryTarget(old,oldIndex,next){
  const matches=(data.sheets||[]).map((sh,i)=>({sh,i})).filter(({sh,i})=>
    i!==oldIndex && sh?.shiftType===next.type &&
    (sh.shiftCloseDate||sh.date)===next.date);
  const linked=matches.find(({sh})=>sh.previousShiftId&&sh.previousShiftId===old.id);
  return linked||matches.find(({i})=>i>oldIndex)||matches[0]||null;
}
function closeHistoryUnused(sh){
  if(!sh||sh.closedAt||sh.scannedAtClose||sh.closeMethod)return false;
  if((data.posReports||[]).some(p=>p?.sheetId===sh.id))return false;
  if((data.scanner?.history||[]).some(h=>h?.sheetId===sh.id))return false;
  if(Object.values(sh.packScanExceptions||{}).some(Boolean))return false;
  return (sh.sections||[]).every(rows=>(rows||[]).every(r=>{
    if(!r)return true;
    return safeNum(r.start)===null && safeNum(r.end)===null &&
      !r.overrideStart&&!r.binEmpty&&!r.lastScanSerial&&!r.endSource &&
      !(r.closures||[]).length&&!r.soldOutUndo;
  }));
}
function closeHistoryRefreshCarry(previous,following){
  let count=0;
  following.sections.forEach((rows,si)=>(rows||[]).forEach((r,ri)=>{
    const prior=previous.sections?.[si]?.[ri];
    if(!r||!prior)return;
    const num=prior.binEmpty?null:safeNum(prior.end);
    r.carriedStartNumber=Number.isSafeInteger(num)&&num>=0?num:null;
    r.startFromPreviousShift=true;
    r.carriedStartFromSheetId=previous.id||null;
    r.start=null;r.overrideStart=false;r.end=null;
    count++;
  }));
  following.previousShiftId=previous.id;
  return count;
}
shiftFinishClose=async function(){
  if(closeHistoryBusy)return;
  const pending=shiftClosePending,old=sheet(),oldIndex=data.current;
  if(!pending||pending.sheetId!==old?.id||!shiftIsActive(old)){
    showToast('Select the active shift you want to close and review its ending numbers.');
    return;
  }
  const status=shiftScanStatus();
  if(!status||status.error||status.missing?.length||status.fail?.length){
    shiftCloseReview();
    showToast('Complete or correct the missing ending numbers before submitting.');
    return;
  }
  const next=shiftNextSuggested(old),chosen=closeHistoryTarget(old,oldIndex,next);
  const otherActive=shiftActiveIndices().filter(i=>i!==oldIndex);
  const willReuse=!!chosen;
  const destination=chosen?.sh;
  const canRefresh=willReuse&&closeHistoryUnused(destination);
  const promptText='Submit and close '+shiftHistLabel(old)+'?\n\n'+
    (willReuse?'Next: open the existing '+next.type+' sheet ('+next.date+').':
      'Next: CREATE a new '+next.type+' sheet ('+next.date+').')+
    '\nYour completed shift and all ending numbers will stay saved.'+
    (willReuse&&!canRefresh?'\nThe existing next sheet has saved activity. Its ticket entries will NOT be changed.':
      '\nThe previous End # values will become the next Start # values; new End # fields are blank.')+
    (otherActive.length?'\nOther active sheets will be preserved, not deleted.':'');
  if(!confirm(promptText))return;
  closeHistoryBusy=true;
  const button=$('shiftSubmitVerified');
  if(button){button.disabled=true;button.textContent='Saving closed shift & next sheet…';}
  const backupOld={closedAt:old.closedAt,closeMethod:old.closeMethod,
    scannedAtClose:old.scannedAtClose,shiftCloseDate:old.shiftCloseDate};
  const backupTarget=destination?{sections:structuredClone(destination.sections),
    previousShiftId:destination.previousShiftId,startedAt:destination.startedAt,
    shiftStartTime:destination.shiftStartTime,shiftEndTime:destination.shiftEndTime}:null;
  let newShift=null,selected=chosen?.i??-1,refreshCount=0;
  try{
    old.closedAt=new Date().toISOString();
    old.closeMethod=pending.required.some(x=>
      pending.scanned[x.si+'-'+x.ri]?.source==='saved-sheet')
      ?'verified-saved-endings':'verified-bin-scans';
    old.scannedAtClose=pending.required.length;
    old.shiftCloseDate=old.shiftCloseDate||old.date;
    if(willReuse){
      if(canRefresh)refreshCount=closeHistoryRefreshCarry(old,destination);
      if(!destination.startedAt&&!destination.closedAt){
        destination.startedAt=new Date().toISOString();
        destination.shiftStartTime=SHIFT_TIMES[next.type].start;
        destination.shiftEndTime=SHIFT_TIMES[next.type].end;
      }
    }else{
      newShift=forwardShiftNewSheet(old,next.type,next.date);
      data.sheets.push(newShift);
      selected=data.sheets.length-1;
    }
    data.current=selected;
    if(!await rolloverPersist())throw Error('Unable to save');
  }catch(e){
    if(newShift&&data.sheets.at(-1)===newShift)data.sheets.pop();
    data.current=oldIndex;
    for(const [key,value] of Object.entries(backupOld))
      if(value===undefined)delete old[key];else old[key]=value;
    if(destination&&backupTarget){
      destination.sections=backupTarget.sections;
      for(const key of ['previousShiftId','startedAt','shiftStartTime','shiftEndTime']){
        const value=backupTarget[key];
        if(value===undefined)delete destination[key];else destination[key]=value;
      }
    }
    showToast('Save failed. The shift is still open and all existing sheets are unchanged.');
    shiftCloseReview();
    closeHistoryBusy=false;
    if(button?.isConnected){button.disabled=false;button.textContent='✓ Close Shift → Open NEXT Sheet';}
    return;
  }
  closeHistoryBusy=false;
  // Never open/download the OLD report after saving; a PDF is available in history.
  shiftClosePending=null;
  try{if(cameraRunning)await stopCamera()}catch(e){}
  const extra=willReuse&&!canRefresh?
    ' Existing next sheet has entries; its numbers were preserved. Check Start # against the closed shift.':
    ' Previous End # values are carried to new Start # fields.';
  forwardShiftOpen(selected,'✓ '+next.type+' '+next.date+' opened.'+extra);
};

playFeedbackTone=function(kind){

  try{
    const Audio=window.AudioContext||window.webkitAudioContext;

      gain.gain.exponentialRampToValueAtTime(.0001,now+delay+length);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start(now+delay);
      oscillator.stop(now+delay+length+.014);
    };
    if(kind==='scan'){

};

/* POS Department 24: robust camera OCR, image verification and PDF photo appendix.
   Does not change lottery pack inventory, POS hardware, store keys or shift math. */
const posAutoOldParse = posParse;
function posAutoAmounts(t){
 const fixed=String(t||'').replace(/\b[Oo](?=[.,]\d)/g,'0').replace(/(?<=\d[.,])[Oo](?=\d)/g,'0');
 return (fixed.match(/-?\$?\d[\d,]*\.\d{2}/g)||[]).map(posNum).filter(Number.isFinite);
}
function posAutoClean(s){
 return String(s||'').replace(/\u00a0/g,' ').replace(/[|]/g,' ')
 .replace(/^\s*[Zz]\s*4\b/,'24').replace(/\b[lI]NSTANT\b/gi,'INSTANT')
 .replace(/\bIN[5S]TANT\b/gi,'INSTANT').replace(/\bINSTANT\s*\/\s*[I1]\b/gi,'INSTANT/L')
 .replace(/[ \t]+/g,' ').trim();
}
function posAutoValid(r){
 return r && [r.gross,r.refund,r.discount,r.net].every(Number.isFinite) &&
 r.gross>=0 && r.net>=0 && Math.abs(r.gross-r.refund-r.discount-r.net)<0.055;
}
posParse=function(raw){
 const text=String(raw||'').replace(/\r/g,'\n'),original=posAutoOldParse(text).filter(posAutoValid);
 if(original.length)return original;
 const lines=text.split('\n').map(posAutoClean).filter(Boolean),hits=[];
 for(let i=0;i<lines.length;i++){
  let anchor=lines[i],first=i;
  if(/^(?:24|2\s*4)\s*$/.test(anchor)&&lines[i+1]&&/^\s*INSTANT\b/i.test(lines[i+1])){
   anchor=anchor+' '+lines[i+1];first=i+1;
  }
  if(!/^(?:24|2\s*4)\s+INSTANT\b/i.test(anchor))continue;
  const end=anchor.replace(/^(?:24|2\s*4)\s+INSTANT(?:\s*\/\s*[A-Z0-9]+)?\s*/i,'');
  const meta=end.match(/^\s*(\d{1,5})\s+(\d+(?:\.\d{1,2})?)\s+(\d+(?:\.\d{1,2})?)\s*%?/);
  const customers=meta?Number(meta[1]):null,items=meta?Number(meta[2]):null,share=meta?Number(meta[3]):null;
  const tail=meta?end.slice(meta[0].length):end;
  let vals=posAutoAmounts(tail);
  for(let j=first+1;j<Math.min(lines.length,first+7)&&vals.length<4;j++){
   const next=lines[j];
   if(/^\s*\d{1,5}\s+[A-Za-z]{3,}/.test(next))break;
   vals.push(...posAutoAmounts(next));
  }
  if(vals.length<4)continue;
  for(let k=0;k<=vals.length-4;k++){
   const [gross,refund,discount,net]=vals.slice(k,k+4);
   const rec={departmentNumber:24,departmentName:'INSTANT/L',customers,items,share,
    gross,refund,discount,net,line:anchor+' | '+[gross,refund,discount,net].join(' ')};
   if(posAutoValid(rec)){hits.push(rec);break}
  }
 }
 return hits.slice(0,10);
};
let posAutoPhoto=null;
async function posAutoPreparePhoto(file){
 const url=URL.createObjectURL(file);
 try{
  const im=await new Promise((ok,fail)=>{const img=new Image();img.onload=()=>ok(img);img.onerror=()=>fail(Error('Photo preview unavailable'));img.src=url});
  const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,scale=Math.min(1,1400/w,1800/h);
  const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.82);
 }finally{URL.revokeObjectURL(url)}
}

const posAutoOldScanner=posReadImageWithFallback;
posReadImageWithFallback=async function(file){
 await posLoadLibrary('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',()=>!!window.Tesseract);
 const worker=await window.Tesseract.createWorker('eng');let bitmap=null,url='',best='',bestScore=-1;
 try{
  if(typeof createImageBitmap==='function')bitmap=await createImageBitmap(file);
  else{
   url=URL.createObjectURL(file);
   bitmap=await new Promise((ok,fail)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>fail(Error('Image could not open'));im.src=url});
  }
  const width=bitmap.width,height=bitmap.height;
  if(!width||!height)throw Error('Invalid photo dimensions');
  const regions=[[0,.43,1,.45],[0,.55,1,.32],[0,.20,1,.60],[0,0,1,1]];
  await worker.setParameters({tessedit_pageseg_mode:'6'});
  for(let i=0;i<regions.length;i++){
   const [rx,ry,rw,rh]=regions[i],x=Math.floor(width*rx),y=Math.floor(height*ry);
   const w=Math.max(1,Math.min(width-x,Math.floor(width*rw))),h=Math.max(1,Math.min(height-y,Math.floor(height*rh)));
   const scale=Math.min(2.3,2200/w,2300/h),canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.floor(w*scale));canvas.height=Math.max(1,Math.floor(h*scale));
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('Photo processing unavailable');
   if(i>0)ctx.filter='grayscale(100%) contrast(145%)';
   ctx.drawImage(bitmap,x,y,w,h,0,0,canvas.width,canvas.height);
   posNote='Auto-scanning Department 24 ('+(i+1)+'/'+regions.length+')...';
   const status=document.getElementById('posNote');if(status)status.textContent=posNote;
   const result=(await worker.recognize(canvas)).data.text||'';
   if(posParse(result).length)return result;
   const score=(/INSTANT/i.test(result)?500:0)+(/\b24\b/.test(result)?250:0)+result.length;
   if(score>bestScore){best=result;bestScore=score}
   canvas.width=canvas.height=0;
  }

 }finally{
  try{await worker.terminate()}catch(e){}
  if(bitmap&&typeof bitmap.close==='function')bitmap.close();

};

    title = explainBin(target.si, target.ri) + ' · ' + (purpose[target.kind] || 'Scan ending ticket');

  }
  if (!guidedMode && view === 'inventory') feedback = inventoryMessage?.text || '';
  if (pendingOperation?.scanned) {

/* Shift-close fix: discard stale required BINs after a confirmed Sold Out.
   Re-check the live sheet at submit time, preserving valid pre-entered End numbers. */
const shiftScanStatusBeforeSoldOut = shiftScanStatus;
shiftScanStatus = function() {
 const p=shiftClosePending,sh=sheet();
 if(p&&p.sheetId===sh.id&&shiftIsActive(sh)){
  const summary=recordedShiftEndings();
  // guideList excludes bins explicitly confirmed Sold Out (r.binEmpty).
  p.required=summary.required.map(x=>({si:x.si,ri:x.ri}));
  const verified={};
  for(const item of summary.ready){
   const r=row(item.si,item.ri),key=item.si+'-'+item.ri;
   const game=String(r.gameNumber||''),pack=String(r.packNumber||'');
   const old=p.scanned?.[key];
   verified[key]=old&&old.end===item.end&&old.game===game&&old.pack===pack
    ?old:{game,pack,end:item.end,at:new Date().toISOString(),source:'saved-sheet'};
  }
  p.scanned=verified;
 }
 return shiftScanStatusBeforeSoldOut();
};



/* Shift-safe empty BIN controls. Do not change ticket sales or pack stock by skipping. */
function lmBinHasNoActivePack(si,ri){
 const r=row(si,ri);if(!r||r.binEmpty)return true;
 const st=scannerState();
 if(Object.values(st.packs||{}).some(p=>p&&Number(p.section)===si&&Number(p.bin)===ri+1))return false;
 if(String(r.gameNumber||'').trim()||String(r.packNumber||'').trim())return false;
 if(safeNum(r.start)!==null||safeNum(r.end)!==null||effectiveStart(data.current,si,ri)!==null)return false;
 if(r.lastScanSerial||r.endSource||r.overrideStart||r.soldOutUndo||(r.closures||[]).length)return false;
 return true;
}
function lmEmptyBinSignature(si,ri){
 const r=row(si,ri)||{},packs=Object.entries(scannerState().packs||{})
  .filter(([k,p])=>p&&Number(p.section)===si&&Number(p.bin)===ri+1)
  .map(([k,p])=>k+'|'+(p.assignedAt||'')).sort();
 return JSON.stringify([r.gameNumber||'',r.packNumber||'',safeNum(r.start),
  safeNum(r.end),effectiveStart(data.current,si,ri),!!r.binEmpty,
  r.lastScanSerial||'',r.endSource||'',!!r.overrideStart,
  (r.closures||[]).length,packs]);
}
function lmEmptyBinConfirmed(si,ri){

}

  p&&Number(p.section)===si&&Number(p.bin)===ri+1);

 const hasNumbers=safeNum(r.start)!==null||safeNum(r.end)!==null||effectiveStart(data.current,si,ri)!==null;

  oldNumbers+warning+'\n\nConfirm Empty / No Pack?'))return;
 if(!sh.noPackBins||typeof sh.noPackBins!=='object')sh.noPackBins={};
 sh.noPackBins[si+'-'+ri]={signature:lmEmptyBinSignature(si,ri),confirmedAt:new Date().toISOString()};

/* Safe Bluetooth ending scan when an old Inventory assignment is attached to the same BIN.
   Do not reassign inventory, overwrite a different pack, or silently mark a roll returned/sold. */
const lmOriginalDailyEndSave=saveDailyEndBarcode;
saveDailyEndBarcode=function(si,ri,d,onStatus=operationStatus){
 const st=scannerState(),r=row(si,ri),key=packKey(d.game,d.pack);
 const conflict=Object.entries(st.packs||{}).filter(([k,p])=>k!==key&&p&&
  Number(p.section)===Number(si)&&Number(p.bin)===Number(ri)+1);
 const oldBanner=typeof document!=='undefined'?document.getElementById('lm-scanner-inventory-warning'):null;
 if(oldBanner)oldBanner.remove();

// Upload each saved change and keep a receiving request open while the app is visible.
let cloudWatchController = null;
let cloudWatchRetry = null;
let cloudWatchFailures = 0;
let cloudReceivePending = false;
let cloudChangeQueued = false;
let cloudUploadRetry = null;
let cloudUploadFailures = 0;

cloudChanged = function () {
  if (!cloudKey) return;
  cloudMutation++;
  cloudDirty = true;
  cloudLocalSet(CLOUD_DIRTY, '1');
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = null;
  cloudMessage('Change saved on this device. Sending to cloud…');
  if (cloudBusy) {
    cloudSyncDue = true;
    return;
  }
  if (cloudChangeQueued) return;
  cloudChangeQueued = true;
  queueMicrotask(() => {
    cloudChangeQueued = false;
    if (navigator.onLine !== false) void cloudSync(false);
  });
};

function cloudReceivingCanApply() {
  const active = document.activeElement;
  return !active || !(active.matches('input, textarea, select') || active.isContentEditable);
}

function cloudWatchStop() {
  clearTimeout(cloudWatchRetry);
  cloudWatchRetry = null;
  if (cloudWatchController) cloudWatchController.abort();
}

async function cloudWatchStart() {
  if (cloudWatchController || !cloudKey || cloudConflict ||
      document.hidden || navigator.onLine === false) return;
  if (cloudReceivePending && !cloudReceivingCanApply()) return;
  const key = cloudKey;
  const controller = new AbortController();
  cloudWatchController = controller;
  let retryDelay = 0;
  try {
    if (cloudReceivePending) {
      cloudReceivePending = false;
      await cloudSync(false);
    }
    while (!controller.signal.aborted && key === cloudKey && !document.hidden && !cloudConflict) {
      const response = await fetch('/api/cloud-watch?rev=' + encodeURIComponent(cloudRev || ''), {
        headers: { 'X-Lottery-Cloud-Key': key },
        cache: 'no-store',
        signal: controller.signal
      });
      if (!response.ok) throw new Error('Receiving connection interrupted.');
      const message = await response.json();
      if (key !== cloudKey || controller.signal.aborted) break;
      cloudWatchFailures = 0;
      if (!message.changed) continue;
      if (!cloudReceivingCanApply()) {
        cloudReceivePending = true;
        cloudMessage('An update is ready. Finish this field to receive it.');
        break;
      }
      if (cloudBusy) {
        cloudReceivePending = true;
        cloudSyncDue = true;
        break;
      }
      await cloudSync(false);
    }
  } catch (error) {
    if (error.name !== 'AbortError') {
      cloudWatchFailures++;
      retryDelay = Math.min(30000, 1000 * 2 ** Math.min(cloudWatchFailures, 5));
      cloudMessage('Receiving connection interrupted. Reconnecting automatically…');
    }
  } finally {
    if (cloudWatchController === controller) cloudWatchController = null;
    if (!document.hidden && navigator.onLine !== false && cloudKey && !cloudConflict &&
        (!cloudReceivePending || cloudReceivingCanApply())) {
      cloudWatchRetry = setTimeout(() => void cloudWatchStart(), retryDelay || 250);
    }
  }
}

const cloudSyncBeforeLiveReceive = cloudSync;
cloudSync = async function (force = false) {
  if (cloudBusy) {
    cloudSyncDue = true;
    return;
  }
  clearTimeout(cloudUploadRetry);
  await cloudSyncBeforeLiveReceive(force);
  if (cloudDirty && !cloudConflict && cloudKey && navigator.onLine !== false) {
    cloudUploadFailures++;
    const delay = Math.min(30000, 1000 * 2 ** Math.min(cloudUploadFailures, 5));
    cloudUploadRetry = setTimeout(() => void cloudSync(false), delay);
  } else {
    cloudUploadFailures = 0;
  }
  void cloudWatchStart();
};

const cloudConnectBeforeLiveReceive = cloudConnect;
cloudConnect = async function (entry) {
  if (cloudBusy) {
    showToast('Wait for the current sync to finish before changing the cloud key.');
    return;
  }
  cloudWatchStop();
  clearTimeout(cloudUploadRetry);
  cloudReceivePending = false;
  cloudConflict = false;
  await cloudConnectBeforeLiveReceive(entry);
  void cloudWatchStart();
};

window.addEventListener('offline', cloudWatchStop);
window.addEventListener('online', () => {
  cloudWatchFailures = 0;
  if (cloudKey) void cloudSync(false);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cloudWatchStop();
  else if (cloudKey) void cloudSync(false);
});
document.addEventListener('focusout', () => {
  if (cloudReceivePending) queueMicrotask(() => void cloudWatchStart());
});
