/* Roll inventory and safe sold-out restocking */
.inv-intro{margin-bottom:22px}.inv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,1fr);gap:18px}
.inv-card{padding:22px}.inv-card h3{margin:0 0 8px;font-size:22px}.inv-card p{color:var(--muted);line-height:1.55}
.inv-card label{display:block;font-size:13px;font-weight:750;color:#506383;margin:14px 0 6px}
.inv-card input,.restock-form input,.restock-form select{width:100%;padding:12px;border:1px solid #dce5f1;border-radius:10px;background:#fff;min-height:46px}
.inv-card .scan-entry{margin:12px 0}.inv-big{font-size:36px;font-weight:850;color:#173c7f}
.inv-summary{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0}
.inv-msg{padding:13px 16px;background:#eaf5fc;border:1px solid #c9dff0;border-radius:12px;line-height:1.5}
.inv-msg.error{background:#fff2ee;border-color:#f5c1b4;color:#9a3822}
.inv-table{width:100%;border-collapse:collapse}.inv-table th,.inv-table td{text-align:left;padding:13px 10px;border-bottom:1px solid #e6edf5}
.inv-table th{font-size:12px;letter-spacing:.5px;color:#71819c}.inv-table td{font-size:14px}
.inv-table-wrap{overflow-x:auto;padding:7px 19px 22px}.inv-count{font-size:22px;font-weight:850;color:#0c7858}
.restock-actions{margin-top:12px}.restock-actions .mini-btn{background:#e8f4ec;color:#12694d;border-color:#badfcc}
.restock-form{margin-top:12px;padding:14px;border:1px solid #c4dfd3;background:#f5fcf8;border-radius:12px}
.restock-form h4{font-size:16px;margin:0 0 6px}.restock-form p{color:#526a5d;font-size:12px;line-height:1.5;margin:0 0 9px}
.restock-form .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.restock-form label{display:block;font-size:12px;font-weight:750;color:#345c4f;margin:9px 0 4px}
.restock-form .restock-buttons{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
@media(max-width:800px){.inv-grid{grid-template-columns:1fr}.inv-card{padding:17px}}

.undo-soldout{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;min-height:43px;background:#e7f8f2;color:#126b4e;border-color:#9acdbb;font-weight:850}

.bin15-fix-body{padding:22px}

.bin15-fix-body input:not([type=checkbox]),.bin15-fix-body select{min-height:51px;width:100%;border:1px solid #8e9aab;border-radius:11px;background:#fff;color:#1b2d4b;padding:9px 12px;font-size:18px}
.bin15-fix-status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0 20px}
.bin15-fix-status>div{padding:13px;border:1px solid #c9d8e5;background:#f0f6fc;border-radius:12px;min-width:0}
.bin15-fix-status strong{display:block;font-size:16px;overflow-wrap:anywhere}.bin15-fix-status small{font-size:12px;color:#4b6382;display:block;margin-top:5px}
.bin15-fix-explanation{line-height:1.55;font-size:15px}

.bin15-fix-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}
.bin15-fix-feedback{font-weight:700;line-height:1.6;color:#15553e;margin:16px 0 0}
.bin15-fix-warning{font-size:13px;line-height:1.55;background:#fff5e8;color:#77511f;border:1px solid #efcf9c;border-radius:10px;padding:14px}
@media(max-width:740px){.bin15-fix-panel{margin:12px 0 17px}.bin15-fix-body{padding:16px}.bin15-fix-status{grid-template-columns:1fr}.bin15-fix-pickers{grid-template-columns:1fr}.bin15-fix-actions .btn{width:100%}}


.bin15-fix-archive{border-top:1px solid #bcc9d6;margin-top:22px;padding-top:19px}
.bin15-fix-archive h4{margin:0 0 7px}
.bin15-fix-archive-record{padding:15px;border:1px solid #b8cbdc;border-radius:12px;margin-top:13px}
.bin15-fix-archive-record>strong{font-size:16px}
.bin15-fix-archive-record>p{font-size:14px;margin:7px 0 11px}
.bin15-fix-archive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:740px){.bin15-fix-archive-grid{grid-template-columns:1fr}}

.bin15-one-tap{width:100%;min-height:58px;font-weight:900;font-size:17px;margin:0 0 13px;white-space:normal;text-align:center}

.scan-load-panel{border:2px solid #a8c8ea;margin:15px 0 20px;scroll-margin-top:12px}
.scan-load-body{padding:12px 20px 22px}
.scan-load-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.scan-load-grid>div{min-width:0;padding:13px;border:1px solid #d2dfec;border-radius:12px;background:#f5f8fd}
.scan-load-grid small{display:block;font-size:12px;color:#425a77;margin-bottom:6px}
.scan-load-grid strong{display:block;font-size:17px;overflow-wrap:anywhere;color:#18314f}
.scan-load-destination{display:block;font-weight:800;margin:14px 0}
.scan-load-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.scan-load-inputs label{font-weight:700;font-size:14px}
.scan-load-inputs input,.scan-load-inputs select{display:block;width:100%;min-height:46px;margin-top:7px;padding:9px;border:1px solid #9dafc6;border-radius:9px;background:#fff;color:#152f4e}
@media(max-width:740px){.scan-load-inputs{grid-template-columns:1fr}}
.scan-load-destination select{display:block;width:100%;min-height:52px;margin-top:8px;border:1px solid #9dafc6;border-radius:10px;padding:10px;background:white;color:#152f4e;font-size:17px}
.scan-load-confirm{display:flex;align-items:flex-start;gap:10px;line-height:1.45;font-size:14px;font-weight:700;margin:15px 0}
.scan-load-confirm input{width:21px;height:21px;flex:none}
.scan-load-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.scan-load-warning{padding:13px;border:1px solid #dcba7d;background:#fff7e9;color:#694713;border-radius:10px;line-height:1.5;margin:12px 0}
@media(max-width:740px){.scan-load-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scan-load-body{padding:10px 14px 20px}.scan-load-actions .btn{width:100%}}

/* Agent returns and bin changes */
.bin-ops{margin-top:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bin-ops .mini-btn{font-size:12px;min-height:39px;padding:8px 11px}
.bin-ops .return-btn{background:#fff5e9;border-color:#f3d5a9;color:#8c5017}.bin-ops .move-btn{background:#edf4ff;border-color:#cbdefb;color:#28549b}
.operation-form{border:1px solid #d7e2ef;border-radius:13px;padding:15px;margin-top:10px;background:#f9fbff}
.operation-form h4{font-size:16px;margin:0 0 6px}.operation-form p{margin:0 0 10px;font-size:12px;line-height:1.6;color:#5b6d83}
.operation-form label{display:block;margin:9px 0 5px;font-size:12px;font-weight:800;color:#365474}
.operation-form input,.operation-form select{width:100%;min-height:44px;border-radius:9px;background:#fff;border:1px solid #d9e3f1;padding:8px 11px}
.operation-form .buttons{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}
.op-preview{margin:10px 0;padding:11px 13px;border-radius:10px;background:#e9f2ff;color:#254a79;font-size:13px;line-height:1.55}
.audit-panel{margin-top:20px}.audit-table-wrap{overflow-x:auto;padding:9px 19px 20px}
.audit-table{width:100%;border-collapse:collapse}.audit-table th,.audit-table td{padding:11px 10px;text-align:left;border-bottom:1px solid #e7edf5;font-size:13px;white-space:nowrap}
.audit-table th{font-size:12px;letter-spacing:.3px;color:#64748b}.audit-table td.audit-detail{white-space:normal;min-width:190px}

/* Barcode-first ending ticket workflow */
.op-scan{margin-top:10px;padding:12px;border:1px solid #d5e5f4;border-radius:12px;background:#f7fbff}
.op-scan .scanner-window{height:205px;min-height:190px;margin:10px 0;border-radius:11px}
.op-scan .scanner-window video{max-height:205px}
.op-scan label{display:block;margin:10px 0 5px;font-size:12px;font-weight:800;color:#38597d}
.op-scan .scan-entry{margin:10px 0}
.op-scan input[type=text]{min-height:44px;width:100%;border:1px solid #cbdaf0;border-radius:9px;padding:10px}
.op-scan-status{background:#e9f4fd;padding:10px;border-radius:9px;font-size:13px;line-height:1.5}
.op-scan-status.is-error{background:#fff0eb;color:#ad3527}
.op-readonly{font-weight:900;background:#edf5ff!important;cursor:default}
.scan-end-trigger{display:block;margin-top:8px;width:100%;font-size:12px!important}
.operation-form button:disabled{opacity:.55}
.manual-end-trigger{display:block;width:100%;margin-top:6px;font-size:12px!important}

/* ═══════════════════════════════════════════════════════════════════
   LOTTERY MASTER — SIGNATURE COLLECTION / LUXURY DESIGN SYSTEM
   Visual-only layer: inventory, scanning and local persistence are unchanged.
   ═══════════════════════════════════════════════════════════════════ */
:root{
 --navy:#101b28;--blue:#ae8748;--lightblue:#f9f1e2;--ink:#1c2833;
 --muted:#6d7884;--border:#e8e0d2;--surface:#fffefa;--soft:#f8f6f1;
 --gold:#b18a4d;--gold-light:#f0d9a9;--gold-dark:#795a30;
 --night:#101b28;--cream:#f8f6f1;
 font-family:"Avenir Next",Avenir,"Segoe UI",Inter,system-ui,sans-serif;
 color:var(--ink);background:var(--cream);
}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 78% -10%,#f0e7d9 0%,transparent 44%),linear-gradient(145deg,#faf8f3,#f4f2ed 74%);color:var(--ink);letter-spacing:.005em}
button,input,select{font-family:inherit}
::selection{background:#ead6b0;color:#14202e}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c69b56;outline-offset:3px}
.sidebar{
 background:radial-gradient(circle at 0% 0%,#24374a 0%,transparent 47%),linear-gradient(174deg,#111e2d,#0c1621 84%);
 color:#e8e2d4;border-right:1px solid #bb925437;box-shadow:10px 0 38px #0c162019;
}
.logo-group{padding-bottom:38px;gap:13px}
.logo-mark{
 position:relative;width:56px;height:56px;
 border-radius:17px;background:linear-gradient(145deg,#efdaa9,#b98b47 58%,#8d642f);
 color:#162334;font-family:Georgia,serif;font-size:37px;
 border:1px solid #fae6bc;
 box-shadow:0 6px 24px #0004,inset 0 1px #fff9;
}
.logo-group strong{
 font-family:Georgia,"Iowan Old Style",Cambria,serif;
 font-size:24px;letter-spacing:-.8px;line-height:1.04;font-weight:700;color:#fff8ea
}
.logo-group small{font-size:10px;letter-spacing:2.4px;color:#d7be91;margin-top:9px;font-weight:800}
.side-label{color:#bd9a61;letter-spacing:2.3px;font-size:10px;padding-left:14px}
.side-nav{gap:9px}
.nav-button{
 color:#b9c2c8;border-radius:13px;padding:14px 15px;
 font-weight:650;letter-spacing:.01em;transition:background .2s ease,color .2s ease,transform .2s ease;
}
.nav-button svg{color:#b4a389}
.nav-button:hover{background:#ffffff0d;color:#fff8ee;transform:translateX(2px)}
.nav-button.active{
 color:#fae5bb;background:linear-gradient(100deg,#c39a5840,#b68b3113);
 border-color:#c19b5847;box-shadow:inset 3px 0 #d9b476;
}
.nav-button.active svg{color:#e1ba77}
.help-card{
 background:linear-gradient(155deg,#2d3b49,#192937);
 border:1px solid #a887505a;box-shadow:0 12px 25px #020b1630;
 border-radius:18px
}
.help-card .help-icon{font-size:30px;color:#e8c58c}
.help-card strong{font-family:Georgia,serif;font-size:19px;font-weight:600;color:#fff6df}
.help-card p{color:#d3d0c9}
.help-card button{
 background:#ecd6ad;color:#172637;border-color:#fae7c4;
 font-weight:800;transition:transform .2s,background .2s
}
.help-card button:hover{background:#ffebc6;transform:translateY(-1px)}
.side-foot{color:#9da7ac;font-size:11px;letter-spacing:.15px}
.main{min-width:0}
.topbar{
 min-height:97px;background:#fffdfaee;
 border-bottom:1px solid #e8dfd1;
 box-shadow:0 2px 25px #18263806;
 padding-top:21px;padding-bottom:21px;
}
.crumb{color:#99805b;font-size:10px;font-weight:850;letter-spacing:2px}
.topbar h1{color:#1b2732;font-family:Georgia,"Iowan Old Style",Cambria,serif;font-weight:700;letter-spacing:-1px;font-size:clamp(25px,2.3vw,33px)}
.topbar-subtitle{font-family:"Avenir Next",Arial,sans-serif;font-size:.62em;letter-spacing:.5px;font-weight:500;color:#9a8566;margin-left:6px}
.content{max-width:1800px;padding-top:32px}
.btn{
 background:#fffefa;color:#243543;border-color:#ded6c9;
 border-radius:11px;min-height:47px;box-shadow:0 2px 7px #14243507;
 font-weight:750;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s
}
.btn:hover{background:#f6f0e5;border-color:#c9ad80;transform:translateY(-1px)}
.btn.primary{
 color:#192735;border-color:#e1c18b;
 background:linear-gradient(135deg,#f8e8c5 0%,#dbb679 56%,#c49855 100%);
 box-shadow:0 6px 16px #a77d3d38;font-weight:850
}
.btn.primary:hover{background:linear-gradient(135deg,#fff0ce,#e3c48c 58%,#cda567);border-color:#d2ab68}
.btn.dark{background:#182b3c;border-color:#182b3c;color:#fff8e7}
.btn.soft{background:#f8f3e9;color:#6d512b;border-color:#e9dac3}
.btn.soft:hover{background:#f4e7d1}
.mini-btn{background:#fffdfa;color:#5e4d36;border:1px solid #dfd2bd;border-radius:10px;font-weight:750}
.mini-btn:hover{background:#f8efdf;border-color:#c9aa77}
.intro{
 min-height:188px;position:relative;overflow:hidden;
 align-items:center;
 padding:30px clamp(24px,3vw,42px);
 background:radial-gradient(circle at 90% 15%,#41536b8c 0%,transparent 31%),linear-gradient(115deg,#142434,#1d3143 68%,#24394a);
 border:1px solid #304355;border-radius:22px;
 box-shadow:0 15px 45px #0f1e2c20,inset 0 1px #fff1;
 margin-bottom:24px
}
.intro:before{
 content:"";pointer-events:none;position:absolute;top:22px;bottom:22px;left:0;width:4px;
 background:linear-gradient(#f5deaf,#ba8c4b,#f5deaf)
}
.intro:after{

<script>
(()=>{'use strict';
const KEY='lottery-master-large-ui-v1';const SIZEKEY='lottery-master-ui-size';const PANEL_TITLES={sheets:'LOTTERY SHIFTS',scanner:'INDIANA SCANNER',inventory:'ROLL INVENTORY',gallery:'PHOTO GALLERY',pos:'INSTANT DEPARTMENT REPORTS',settings:'SETTINGS'};
const SAMPLE_NAMES=['Luxe','$500 Grand','Power 50x','Ultimate Millions','Multiplier Mania','Sizzlin’ 7s','20x The Money','High Roller'];
const SAMPLE_PRICES=[50,50,50,30,30,30,20,20];
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);
const safeNum=x=>x===null||x===undefined||x===''?null:(Number.isFinite(Number(x))?Number(x):null);

const PRICE_ROLL_COUNTS=Object.freeze({'50':20,'30':20,'20':30,'10':50,'5':100,'3':100,'2':100,'1':200});
const rollStartForPrice=price=>{const n=safeNum(price),count=n===null?null:PRICE_ROLL_COUNTS[String(n)];return count?count-1:null};
const SOUND_SETTING_KEY='lottery-master-feedback-sounds-v1';
let feedbackSoundsOn=true,feedbackAudioContext=null,lastFeedbackScan='',lastFeedbackScanAt=0,scanFlashTimer=null;
try{feedbackSoundsOn=localStorage.getItem(SOUND_SETTING_KEY)!=='off'}catch(_){}
function updateSoundToggle(){const b=$('soundToggle');if(!b)return;b.textContent=feedbackSoundsOn?'🔊 Sound on':'🔇 Sound off';b.setAttribute('aria-pressed',String(feedbackSoundsOn))}
function playFeedbackTone(kind){
 if(!feedbackSoundsOn)return;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
  const ctx=feedbackAudioContext||(feedbackAudioContext=new Audio());
  if(ctx.state==='suspended')void ctx.resume().catch(()=>{});
  const t=ctx.currentTime;
  const note=(hz,delay,duration,volume)=>{
   const o=ctx.createOscillator(),g=ctx.createGain();
   o.type=kind==='scan'?'sine':'triangle';o.frequency.setValueAtTime(hz,t+delay);
   g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(volume,t+delay+.008);
   g.gain.exponentialRampToValueAtTime(.0001,t+delay+duration);
   o.connect(g);g.connect(ctx.destination);o.start(t+delay);o.stop(t+delay+duration+.015);
  };
  if(kind==='scan'){note(880,0,.095,.055);note(1175,.105,.13,.065)}
  else note(600,0,.06,.019);
 }catch(_){}
}
function scanAcknowledged(d){
 if(!d||d.error)return;
 const code=String(d.raw||(String(d.game)+'-'+String(d.pack)+'-'+String(d.ticket))),now=Date.now();
 if(code===lastFeedbackScan&&now-lastFeedbackScanAt<950)return;
 lastFeedbackScan=code;lastFeedbackScanAt=now;
 playFeedbackTone('scan');
 document.body.classList.add('lm-scan-detected');
 clearTimeout(scanFlashTimer);scanFlashTimer=setTimeout(()=>document.body.classList.remove('lm-scan-detected'),520);
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;
 b.classList.remove('lm-tap');void b.offsetWidth;b.classList.add('lm-tap');
 if(b.id==='soundToggle'){
  feedbackSoundsOn=!feedbackSoundsOn;
  try{localStorage.setItem(SOUND_SETTING_KEY,feedbackSoundsOn?'on':'off')}catch(_){}
  updateSoundToggle();if(feedbackSoundsOn)playFeedbackTone('button');
 }else playFeedbackTone('button');
},true);
document.addEventListener('animationend',event=>{if(event.animationName==='lmTap')event.target.classList?.remove('lm-tap')});
document.addEventListener('input',event=>{if(event.target?.id==='manualCustomPrice')updateManualGameHint()});
updateSoundToggle();

function emptySlot(){return{start:null,end:null,price:null,overrideStart:false,binEmpty:false,closures:[],ticketName:'',photoId:null}}
const EXTRA_BIN_MIN=40,EXTRA_BIN_STEP=8,EXTRA_BIN_LIMIT=128;
function ensureExtraBins(){
 // Keep the same bin positions across historical and future sheets.
 let changed=false;
 if(!Array.isArray(data?.sheets))return false;
 for(let si=0;si<2;si++){
  const count=Math.max(EXTRA_BIN_MIN,...data.sheets.map(sh=>sh.sections?.[si]?.length||0));
  for(const sh of data.sheets){
   if(!Array.isArray(sh.sections?.[si]))continue;
   while(sh.sections[si].length<count){sh.sections[si].push(emptySlot());changed=true}
  }
 }
 return changed;
}
function addExtraBins(si=section){
 const current=sheet().sections[si]?.length||0;
 if(current>=EXTRA_BIN_LIMIT)return showToast('This section already has the maximum number of bins.');
 const count=Math.min(EXTRA_BIN_LIMIT,current+EXTRA_BIN_STEP);
 for(const sh of data.sheets){const rows=sh.sections?.[si];if(!rows)continue;while(rows.length<count)rows.push(emptySlot())}
 // Empty bins have independent saved setups and will carry through future weeks.
 saveSoon();renderSheets();
 showToast('Added empty bins '+(current+1)+'–'+count+' to Section '+(si+1)+'. Ready for moves.');
}
function demo(){let s=Array.from({length:2},()=>Array.from({length:32},emptySlot));SAMPLE_NAMES.forEach((n,i)=>{s[0][i].ticketName=n;s[0][i].price=SAMPLE_PRICES[i]});return{version:3,catalogVersion:1,legacyCatalogImported:false,photos:{},current:0,sheets:[{id:'sheet-1',name:'Sheet 1',date:new Date().toISOString().slice(0,10),sections:s}]}}
let data=demo(),view='sheets',section=0,query='',uiSize='large',modalContext=null,saveTimer=null,pendingImage=null,toastTimer=null,dirty=false;
const DBNAME='LotteryMasterLargeUI';let dbPromise;
function openDB(){if(!('indexedDB'in window))return Promise.reject(new Error('No IndexedDB'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function idbGet(){let db=await openDB();return new Promise((resolve,reject)=>{let tx=db.transaction('kv','readonly'),req=tx.objectStore('kv').get(KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idbSet(value){let db=await openDB();return new Promise((resolve,reject)=>{let tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(value,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function saveSoon(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await idbSet(data);dirty=false}catch(e){try{localStorage.setItem(KEY,JSON.stringify(data));dirty=false}catch(err){showToast('Cannot save locally. Export a backup now to keep your changes.')}}},550);if(cloudKey)cloudChanged()}
function validBackup(o){return o&&Array.isArray(o.sheets)&&o.sheets.length>0&&o.sheets.every(x=>Array.isArray(x.sections)&&x.sections.length>=2&&x.sections.every(sec=>Array.isArray(sec)))}
function sheet(){return data.sheets[Math.max(0,Math.min(data.sheets.length-1,data.current|0))]}
function row(si,ri){return sheet()?.sections?.[si]?.[ri]}
function prepareTicketDefaults(){
 let changed=false;
 for(const sh of data.sheets)for(const rows of (sh.sections||[]))for(const r of rows){
  if(Object.prototype.hasOwnProperty.call(r,'name')){r.ticketName=String(r.name||'');delete r.name;changed=true}
 }
 if(!Array.isArray(data.ticketDefaults)){
  const latest=data.sheets[data.sheets.length-1];
  data.ticketDefaults=(latest.sections||[]).map((rows,si)=>rows.map((_,ri)=>{
   const history=data.sheets.map(sh=>sh.sections?.[si]?.[ri]).reverse();
   const named=history.find(r=>r?.ticketName);
   const priced=history.find(r=>safeNum(r?.price)!==null);
   const pictured=history.find(r=>r?.photoId&&typeof data.photos?.[r.photoId]==='string');
   return{ticketName:named?.ticketName||'',price:safeNum(priced?.price),photoId:pictured?.photoId||null};
  }));changed=true;
 }
 return changed;
}
function savedTicketSetup(si,ri){
 if(!Array.isArray(data.ticketDefaults))prepareTicketDefaults();
 if(!Array.isArray(data.ticketDefaults[si]))data.ticketDefaults[si]=[];
 if(!data.ticketDefaults[si][ri]){
  const r=data.sheets[data.sheets.length-1]?.sections?.[si]?.[ri]||emptySlot();
  data.ticketDefaults[si][ri]={ticketName:r.ticketName||'',price:safeNum(r.price),photoId:r.photoId||null};
 }
 return data.ticketDefaults[si][ri];
}
function rememberTicketSetup(si,ri,r,fields){
 const t=savedTicketSetup(si,ri);
 if(fields.includes('ticketName'))t.ticketName=String(r.ticketName||'');
 if(fields.includes('price'))t.price=safeNum(r.price);
 if(fields.includes('photoId'))t.photoId=r.photoId||null;
}
function effectiveStart(sheetIndex,si,ri){let r=data.sheets[sheetIndex]?.sections?.[si]?.[ri];if(!r)return null;if(r.overrideStart||sheetIndex===0)return safeNum(r.start);let prev=data.sheets[sheetIndex-1]?.sections?.[si]?.[ri];return prev?.binEmpty?null:(safeNum(prev?.end)??safeNum(r.start))}
function sale(sheetIndex,si,ri){
 let r=data.sheets[sheetIndex]?.sections?.[si]?.[ri];
 if(!r)return{count:0,total:0};
 const archived=(Array.isArray(r.closures)?r.closures:[]).reduce((a,c)=>{
  if(c&&['sold_roll','agent_return','bin_move'].includes(c.kind)&&Number.isSafeInteger(c.count)&&c.count>=0){a.count+=c.count;a.total+=Number(c.total)||0}
  return a;
 },{count:0,total:0});
 let a=effectiveStart(sheetIndex,si,ri),b=safeNum(r.end);
 if(a===null&&b===null&&!r.binEmpty&&!r.ticketName&&!r.gameNumber&&!r.packNumber)return archived;
 if(a===null||(b===null&&!r.binEmpty))return{count:archived.count||null,total:archived.total};
 let count=r.binEmpty?Math.max(0,a+1):Math.max(0,a-b);
 return{count:archived.count+count,total:archived.total+count*(safeNum(r.price)||0)};
}
function stats(){let a=sheet(),sales=0,revenue=0,tracked=0,pictures=0;for(let si=0;si<2;si++)(a.sections[si]||[]).forEach((r,i)=>{if(r.ticketName)tracked++;if(getImage(r,si,i))pictures++;let s=sale(data.current,si,i);if(s.count!==null){sales+=s.count;revenue+=s.total}});return{sales,revenue,tracked,pictures}}
// When a BIN lacks its own photo, use the unique matching ticket photo from the existing gallery.
// Never mutate the saved photo library or override a BIN's manually selected photo.
function galleryNameKey(name){
 return String(name||'').normalize('NFKC').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function galleryPhotoId(r){
 if(!r||!galleryNameKey(r.ticketName))return null;
 const targetName=galleryNameKey(r.ticketName),targetPrice=safeNum(r.price),targetGame=String(r.gameNumber||'').trim();
 const found=new Set();
 const visit=source=>{
  if(!source?.photoId||!data.photos?.[source.photoId]||galleryNameKey(source.ticketName)!==targetName)return;
  const sourcePrice=safeNum(source.price),sourceGame=String(source.gameNumber||'').trim();
  if(targetGame&&sourceGame&&targetGame!==sourceGame)return;
  if(targetPrice!==null&&sourcePrice!==null&&targetPrice!==sourcePrice)return;
  // Need the matching face value or matching game number, never the title alone.
  if(!(targetPrice!==null&&sourcePrice!==null&&targetPrice===sourcePrice) &&
     !(targetGame&&sourceGame&&targetGame===sourceGame))return;
  if(/^data:image\/(jpeg|png|webp|gif);base64,/i.test(data.photos[source.photoId]))found.add(source.photoId);
 };
 for(const defaults of data.ticketDefaults||[])for(const source of defaults||[])visit(source);
 for(const sh of data.sheets||[])for(const sec of sh.sections||[])for(const source of sec||[])visit(source);
 return found.size===1?[...found][0]:null;
}
function resolvedGalleryPhotoId(r,si,ri){
 if(!r)return null;
 if(typeof data.photos?.[r.photoId]==='string')return r.photoId;
 if(r.photoId?.startsWith('pcatalog-')){
  const original=data.sheets?.[0]?.sections?.[si]?.[ri];
  if(typeof data.photos?.[original?.photoId]==='string')return original.photoId;
 }
 return galleryPhotoId(r);
}
function getImage(r,si,ri){
 const id=resolvedGalleryPhotoId(r,si,ri);
 const photo=id?data.photos?.[id]:null;

// One-tap correction for accidental BIN 15 Sold Out. Keep all saved ticket
// numbers, named games, photos and legitimate previous-pack sales unchanged.
function undoBin15WithSavedData(wi=data.current,si=section){
 wi=Number(wi);si=Number(si);const ri=14;
 const sh=data.sheets[wi],r=sh?.sections?.[si]?.[ri];
 if(!r)return showToast('Select the sheet and section that contain BIN 15.');
 const st=scannerState(),key=r.gameNumber&&r.packNumber?packKey(r.gameNumber,r.packNumber):null;
 const stock=key?st.stock[key]:null;
 const isAccidentallySoldOut=!!r.binEmpty,hasStaleStock=stock?.status==='sold_out';
 if(!isAccidentallySoldOut&&!hasStaleStock){
  data.current=wi;section=si;query='';
  showBin15Repair(wi,si);
  showToast((r.closures||[]).some(c=>c?.kind==='sold_roll')?'BIN 15 is active; check Previous packs counted as Sold Out below.':'BIN 15 is already NOT Sold Out. Your existing numbers are saved.');
  return false
 }
 const start=effectiveStart(wi,si,ri)??safeNum(r.start),end=safeNum(r.end);
 const printedStart=start===null?'not entered':String(start).padStart(3,'0');
 const printedEnd=end===null?'not entered':String(end).padStart(3,'0');
 if(!confirm('Undo accidental Sold Out for '+(sh.name||'this sheet')+', Section '+(si+1)+', BIN 15?\n\nKeep your existing Start #'+printedStart+' and End #'+printedEnd+' unchanged. This will remove the incorrect Sold Out flag and recalculate sales from your saved data.'))return false;
 let stockMessage='';let restored=false;
 if(wi===data.sheets.length-1&&key&&stock?.status==='sold_out'){
  const linked=st.packs[key],collision=Object.entries(st.packs).some(([k,p])=>k!==key&&p.section===si&&p.bin===15),moved=linked&&(linked.section!==si||linked.bin!==15);
  if(collision||moved)stockMessage='Pack inventory not restored because a different BIN assignment exists.';
  else{
   const snapshot=(Array.isArray(r.soldOutUndo?.packs)?r.soldOutUndo.packs:[]).find(x=>x.key===key);
   const prev=snapshot?.pack;
   st.packs[key]=prev?{...prev,section:si,bin:15}:{section:si,bin:15,game:r.gameNumber,pack:r.packNumber,name:r.ticketName||stock.name||'',assignedAt:new Date().toISOString()};
   stock.status='in_bin';stock.section=si;stock.bin=15;delete stock.soldOutAt;
   restored=true;stockMessage='Pack inventory restored.';
  }
 }else if(wi!==data.sheets.length-1)stockMessage='Historical sheet corrected; current inventory left unchanged.';
 else if(hasStaleStock)stockMessage='Pack status needs review in Roll Inventory.';
 const previous={binEmpty:!!r.binEmpty,start:r.start??null,end:r.end??null,overrideStart:!!r.overrideStart,inventoryStatus:stock?.status||null};
 r.binEmpty=false;delete r.soldOutUndo;
 if(start!==null&&effectiveStart(wi,si,ri)===null){r.start=start;r.overrideStart=true}
 const time=new Date().toISOString();
 if(!Array.isArray(data.correctionHistory))data.correctionHistory=[];
 data.correctionHistory.unshift({kind:'undo_bin15_keep_saved_data',at:time,sheetId:sh.id,section:si,bin:15,game:r.gameNumber||'',pack:r.packNumber||'',before:previous,after:{binEmpty:false,start:r.start??null,end:r.end??null},inventoryRestored:restored});
 st.history.unshift({at:time,mode:'undo_bin15_keep_saved_data',sheetId:sh.id,section:si,bin:15,game:r.gameNumber||'',pack:r.packNumber||'',inventoryRestored:restored});
 data.current=wi;section=si;query='';bin15RepairOpen=false;
 saveSoon();
 if(view!=='sheets')setView('sheets');else renderSheets();
 const numbersOK=start!==null&&end!==null&&Number.isSafeInteger(start)&&Number.isSafeInteger(end)&&end<=start&&end>=0;
 showToast('BIN 15 is no longer Sold Out. '+(numbersOK?'Saved ticket numbers were kept.':'Please verify your End # when you can.')+' '+stockMessage);
 setTimeout(()=>document.querySelector('.ticket[data-row="14"]')?.scrollIntoView({behavior:'smooth',block:'center'}),120);
 return true
}

function saveBin15Repair(){
 const ri=14,r=row(section,ri),sh=sheet();
 if(!r)return bin15RepairFeedback('BIN 15 could not be found.');
 const startRaw=String($('bin15FixStart')?.value??'').trim(),endRaw=String($('bin15FixEnd')?.value??'').trim();
 const start=Number(startRaw),end=Number(endRaw);
 if(!/^\d{1,3}$/.test(startRaw)||!/^\d{1,3}$/.test(endRaw)||!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start>999||end>start){
  return bin15RepairFeedback('Check the printed Start # and last unsold End #. Enter whole numbers 000–999; End # cannot exceed Start #.');
 }
 if(!$('bin15FixConfirm')?.checked)return bin15RepairFeedback('Confirm the numbers match the physical roll before saving.');
 const st=scannerState(),key=r.gameNumber&&r.packNumber?packKey(r.gameNumber,r.packNumber):null;
 const previous={binEmpty:!!r.binEmpty,start:r.start??null,effectiveStart:effectiveStart(data.current,section,ri),end:r.end??null,overrideStart:!!r.overrideStart};
 const oldStock=key&&st.stock[key]?{...st.stock[key]}:null;
 let restored=false, inventoryMessage='No linked pack inventory to restore.';
 const canSyncStock=data.current===data.sheets.length-1&&key;
 if(canSyncStock){
  const stock=st.stock[key],active=st.packs[key];
  const anotherAssigned=Object.entries(st.packs).some(([k,m])=>k!==key&&m.section===section&&m.bin===ri+1);
  const moved=active&&(active.section!==section||active.bin!==ri+1);
  if(anotherAssigned||moved)inventoryMessage='Inventory was not modified because the pack or BIN has another assignment.';
  else if(!stock||stock.status==='sold_out'){
   const previousPack=(Array.isArray(r.soldOutUndo?.packs)?r.soldOutUndo.packs:[]).find(x=>x.key===key)?.pack;
   st.packs[key]=previousPack?{...previousPack,section,bin:ri+1}:{section,bin:ri+1,game:r.gameNumber,pack:r.packNumber,name:r.ticketName||'',assignedAt:new Date().toISOString()};
   if(!stock)st.stock[key]={game:r.gameNumber,pack:r.packNumber,name:r.ticketName||'',receivedAt:new Date().toISOString(),source:'correct-bin15'};
   st.stock[key].status='in_bin';st.stock[key].section=section;st.stock[key].bin=ri+1;
   delete st.stock[key].soldOutAt;restored=true;
   inventoryMessage='The original pack inventory assignment was restored.';
  }else if(stock.status==='in_bin'&&active&&active.section===section&&active.bin===ri+1){
   inventoryMessage='The pack was already active in inventory.';
  }else inventoryMessage='Inventory was not modified because the pack has status '+stock.status+'.';
 }else if(key)inventoryMessage='Historical sheet corrected; current pack inventory was left unchanged.';
 r.start=start;r.end=end;r.overrideStart=true;r.binEmpty=false;delete r.soldOutUndo;
 if(!Array.isArray(data.correctionHistory))data.correctionHistory=[];
 data.correctionHistory.unshift({kind:'bin15_sold_out_correction',at:new Date().toISOString(),sheetId:sh.id,section,bin:15,game:r.gameNumber||'',pack:r.packNumber||'',before:previous,after:{start,end,binEmpty:false},stockBefore:oldStock?.status||null,stockRestored:restored});
 st.history.unshift({at:new Date().toISOString(),mode:'correct_bin15_sold_out',sheetId:sh.id,section,bin:15,game:r.gameNumber||'',pack:r.packNumber||'',previousStart:previous.effectiveStart,previousEnd:previous.end,start,end,stockRestored:restored});
 saveSoon();renderSheets();
 const msg='BIN 15 is NOT Sold Out. Sales now use Start #'+start+' minus End #'+end+'. '+inventoryMessage;
 const feedback=$('bin15FixFeedback');if(feedback)feedback.textContent=msg;
 showToast('BIN 15 corrected. '+inventoryMessage);
}

}

function shiftLocalYmd(date){
 return String(date.getFullYear()).padStart(4,'0')+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function shiftDatePlusDays(date,days){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||'')))return '';
 const [y,m,d]=date.split('-').map(Number);
 return shiftLocalYmd(new Date(y,m-1,d+days,12));
}
function shiftDateForClose(type,now=new Date()){
 // Night reports follow the date the 9 PM shift began, not the morning date.
 const priorDay=type==='Night Shift'&&now.getHours()<21;
 return shiftLocalYmd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-(priorDay?1:0),12));
}

function shiftCloseDescription(type,date){
 if(type==='Night Shift')return 'Night: '+date+' 9:00 PM to '+shiftDatePlusDays(date,1)+' 9:00 AM. Report date: '+date+' (when shift began).';
 if(type==='Day Shift')return 'Day: '+date+' 9:00 AM to 9:00 PM. Report date: '+date+'.';
 return 'Select a shift to calculate its start date.';
}

const pdfPlain=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2010-\u2015]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[^\x20-\x7e]/g,'?');
const pdfEscape=v=>pdfPlain(v).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
const pdfMoney=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pdfNumber=n=>n===null||n===undefined?'--':String(n).padStart(3,'0');
const pdfShort=(v,max)=>{let t=pdfPlain(v);return t.length>max?t.slice(0,max-3)+'...':t};
const pdfDate=()=>new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});
const hasReportTicket = r => !!(r && (r.ticketName || r.gameNumber || r.packNumber || r.closures?.length || r.binEmpty || safeNum(r.start) !== null || safeNum(r.end) !== null));
const pdfMetric=(si)=>{
 let s=data.sheets[si],count=0,revenue=0,incomplete=0,active=0,sections=[];
 (s.sections||[]).forEach((rows,sectionIndex)=>{let sec={sold:0,revenue:0,unfilled:0,active:0};(rows||[]).forEach((r,ri)=>{
 if(sectionIndex !== 0 || !hasReportTicket(r)) return; const n=sale(si,sectionIndex,ri);if(r.ticketName||r.gameNumber||r.packNumber) {active++;sec.active++}
 if(n.count===null){if(r.ticketName||r.gameNumber||r.packNumber||r.start!==null||r.end!==null){incomplete++;sec.unfilled++}}
 else{count+=n.count;revenue+=n.total;sec.sold+=n.count;sec.revenue+=n.total}
 });sections.push(sec)});
 return {count,revenue,incomplete,active,sections};
};

function captureOperationScan(raw,format=''){
 const p=pendingOperation;if(!p)return;
 const d=decodeInventorySerial(raw,format);
 p.scanned=null;
 const submit=$('agentReturnForm')?.querySelector('button[type=submit]')||$('binMoveForm')?.querySelector('button[type=submit]')||$('restockForm')?.querySelector('button[type=submit]')||$('dailyEndForm')?.querySelector('button[type=submit]');
 if(submit)submit.disabled=true;
 const r=row(p.si,p.ri);
 if(d.error&&d.draft&&r?.gameNumber&&r?.packNumber&&String(r.gameNumber)===d.draft.game&&String(r.packNumber)===d.draft.pack){d.error=null;d.game=d.draft.game;d.pack=d.draft.pack;d.ticket=d.draft.ticket;d.gameInfo={name:r.ticketName||'Game '+r.gameNumber};}
 if(d.error)return operationStatus(d.error,true);
 if(!r)return operationStatus('The ticket bin is no longer available.',true);
 if(p.kind==='restock'){
  const selected=$('restockPack')?.value;
  if(selected!==packKey(d.game,d.pack))return operationStatus('Wrong pack scanned. Select the matching unopened pack in inventory before scanning.',true);
 }else{
  if(r.gameNumber&&String(r.gameNumber)!==d.game)return operationStatus('Wrong game: scanned #'+d.game+' but this bin is game #'+r.gameNumber+'.',true);
  if(r.packNumber&&String(r.packNumber)!==d.pack)return operationStatus('Wrong pack: scanned pack '+d.pack+' but this bin is pack '+r.packNumber+'.',true);
  // A manually named game cannot invalidate the barcode; confirmation happens when saving.
  const result=safeEndRange(p.si,p.ri,d.ticket);
  if(result.error&&!(p.kind==='daily_end'&&result.error==='Enter a valid Start # first.'))return operationStatus(result.error,true);
 }
 p.scanned=d;scanAcknowledged(d);
 const id={agent_return:'returnedEnd',bin_move:'moveEnd',restock:'restockEnd',daily_end:'dailyScannedEnd'}[p.kind],el=$(id);
 if(el)el.value=String(Number(d.ticket)).padStart(d.ticket.length,'0');
 operationStatus('✓ Matched game #'+d.game+' / pack '+d.pack+'. Scanned End #'+d.ticket+'.',false);
 if(submit)submit.disabled=false;
 const range=p.kind==='restock'?null:safeEndRange(p.si,p.ri,d.ticket);
 const preview=$(p.kind==='agent_return'?'returnPreview':p.kind==='bin_move'?'movePreview':p.kind==='daily_end'?'dailyScanPreview':'restockPreview');
 if(p.kind==='daily_end')return saveDailyEndBarcode(p.si,p.ri,d);
 if(preview)preview.textContent=p.kind==='restock'?'Scanned new roll end #'+d.ticket+'. Enter the Start # and confirm.':(range?.error?(p.kind==='daily_end'&&range.error==='Enter a valid Start # first.'?'End #'+d.ticket+' recognized. Enter Start # to calculate sales.':range.error):('Scanned #'+d.ticket+' · '+range.sold+' sold · '+usd(range.amount)+' sales'+(p.kind==='agent_return'?' · '+range.unsold+' returned':'')));
}
function saveDailyEndBarcode(si,ri,d,onStatus=operationStatus){
 const r=row(si,ri),st=scannerState(),key=packKey(d.game,d.pack);
 if(!r||r.binEmpty)return onStatus('Bin already sold out.',true);
 const q=safeEndRange(si,ri,d.ticket);
 if(q.error&&q.error!=='Enter a valid Start # first.')return onStatus(q.error,true);
 const mapped=st.packs[key];
 if(mapped&&(mapped.section!==si||mapped.bin!==ri+1))return onStatus('Pack already assigned to a different bin.',true);
 if(Object.entries(st.packs).some(([k,p])=>k!==key&&p.section===si&&p.bin===ri+1))return onStatus('Another pack is assigned here. Move or return it first.',true);
 // An old inventory status must not block an actual end-of-shift ticket count.
 // Only allow this for a physical BIN already identified as the same game AND pack.
 const historicalStatus=['returned','sold_out'].includes(st.stock[key]?.status)?st.stock[key].status:null;
 if(historicalStatus&&(String(r.gameNumber||'')!==d.game||String(r.packNumber||'')!==d.pack))
  return onStatus('This pack has historical status '+historicalStatus+'. To save its ending number, scan the ticket in the matching game-and-pack BIN.',true);
 const previousEnd=safeNum(r.end);
 if(previousEnd!==null&&Number(d.ticket)>previousEnd&&!confirm('Ending #'+d.ticket+' is higher than saved #'+previousEnd+'. Save this correction?'))
  return onStatus('Previous End # kept.',false);
 if(!r.gameNumber||!r.packNumber||(r.ticketName&&d.gameInfo.catalogMatch&&!namesMatch(r.ticketName,d.gameInfo.name))){
  if(!confirm('Save Game '+d.game+' Pack '+d.pack+' in '+explainBin(si,ri)+'? Confirm it is the correct physical bin.'))return onStatus('Scan decoded but bin was not confirmed.',true);
 }
 r.end=Number(d.ticket);r.gameNumber=d.game;r.packNumber=d.pack;r.binEmpty=false;r.lastScanSerial=d.game+'-'+d.pack+'-'+d.ticket;
 if(!r.ticketName)r.ticketName=d.gameInfo.name;
 if(safeNum(r.price)===null&&safeNum(d.gameInfo.price)!==null)r.price=d.gameInfo.price;
 if(!historicalStatus){
  if(!mapped)st.packs[key]={section:si,bin:ri+1,game:d.game,pack:d.pack,name:r.ticketName,assignedAt:new Date().toISOString()};
  if(!st.stock[key])st.stock[key]={game:d.game,pack:d.pack,name:r.ticketName,source:'bin-scan',receivedAt:new Date().toISOString()};
  st.stock[key].status='in_bin';st.stock[key].section=si;st.stock[key].bin=ri+1;
 }
 r.endSource='scan';
 logScan(d,si,ri,historicalStatus?'historical-pack-end':'daily-end');
 rememberTicketSetup(si,ri,r,['ticketName','price']);saveSoon();drawRows();updateStatsDisplay();
 showToast('Bin '+(ri+1)+' End #'+d.ticket+' saved.'+(historicalStatus?' Inventory '+historicalStatus+' status kept.':'') );
 return true;
}

// Auto-save End # after typing stops, when the field is left, or on Enter.
const endAutoTimers=new WeakMap();
function endSaveStatus(input,message,error=false){
 const status=input.closest('.field')?.querySelector('.end-save-status');
 if(status){status.textContent=message;status.classList.toggle('error',!!error)}
}
function queueAutoEnd(input,si,ri,whichSheet){
 const prior=endAutoTimers.get(input);
 if(prior)clearTimeout(prior);
 endSaveStatus(input,'Saving…');
 const timer=setTimeout(()=>{endAutoTimers.delete(input);autoSaveEnd(si,ri,input,whichSheet)},750);
 endAutoTimers.set(input,timer);
}
function flushAutoEnd(input,si,ri,whichSheet){
 const timer=endAutoTimers.get(input);
 if(timer){clearTimeout(timer);endAutoTimers.delete(input);autoSaveEnd(si,ri,input,whichSheet)}
}
function autoSaveEnd(si,ri,input,whichSheet){
 const r=data.sheets[whichSheet]?.sections?.[si]?.[ri];
 if(!r||r.binEmpty){endSaveStatus(input,'Bin is sold out. Load next roll first.',true);return false}
 const value=String(input.value??'').trim();
 if(value&&!/^\d{1,3}$/.test(value)){endSaveStatus(input,'Enter 0 to 999 (numbers only).',true);return false}
 const nextEnd=value===''?null:Number(value),start=effectiveStart(whichSheet,si,ri);
 if(nextEnd!==null&&start!==null&&(start<0||!Number.isSafeInteger(start)||nextEnd>start)){
  endSaveStatus(input,'End # cannot be higher than Start #'+start+'.',true);return false;
 }
 const oldEnd=safeNum(r.end);
 if(oldEnd===nextEnd){endSaveStatus(input,nextEnd===null?'End # is empty.':'✓ Saved End #'+nextEnd);return true}
 if(oldEnd!==null&&nextEnd!==null&&nextEnd>oldEnd&&!confirm('Increasing End # will reduce calculated sales. Continue?')){
  input.value=String(oldEnd);endSaveStatus(input,'Previous End #'+oldEnd+' kept.');return false;
 }
 r.end=nextEnd;r.lastScanSerial='';r.endSource=nextEnd===null?null:'manual';saveSoon();
 if(data.current===whichSheet&&section===si){updateRowAmounts(ri);updateStatsDisplay()}
 endSaveStatus(input,nextEnd===null?'✓ End # cleared':'✓ Auto-saved End #'+nextEnd);
 return true;
}

// Restore a BIN mistakenly marked sold out, including its inventory assignment.
function undoSoldOutBin(si,ri){
 if(ri===14){return undoBin15WithSavedData(data.current,si);}
 const r=row(si,ri);if(!r||!r.binEmpty){showToast('This BIN is not marked sold out.');return false}
 const st=scannerState(),snapshot=Array.isArray(r.soldOutUndo?.packs)?r.soldOutUndo.packs:[];
 const key=r.gameNumber&&r.packNumber?packKey(r.gameNumber,r.packNumber):null;
 const keys=snapshot.length?snapshot.map(x=>x.key):(key&&st.stock[key]?.status==='sold_out'?[key]:[]);
 if(Object.entries(st.packs).some(([k,p])=>p.section===si&&p.bin===ri+1&&!keys.includes(k))){
  showToast('Another pack is already assigned to this BIN. Review the inventory before undoing.');return false
 }
 for(const k of keys){
  const active=st.packs[k],stock=st.stock[k];
  if(active&&(active.section!==si||active.bin!==ri+1)){
   showToast('The original pack is now assigned to a different BIN; cannot undo safely.');return false
  }
  if(stock&&stock.status!=='sold_out'&&!(active&&active.section===si&&active.bin===ri+1)){
   showToast('This pack was changed in inventory. Check its status before undoing.');return false
  }
 }
 if(!confirm('Undo Sold Out for '+explainBin(si,ri)+'?\n\nRestore this BIN to active, restore its pack in inventory when possible, and recalculate sales using the saved Start and End numbers?'))return false;
 for(const item of snapshot){
  st.packs[item.key]={...item.pack};
  if(item.stock)st.stock[item.key]={...item.stock};
  else if(st.stock[item.key]){
   st.stock[item.key].status='in_bin';
   st.stock[item.key].section=si;st.stock[item.key].bin=ri+1;
   delete st.stock[item.key].soldOutAt;
  }
 }
 // Recovery for sold-out records saved before the Undo feature existed.
 if(!snapshot.length&&key&&st.stock[key]?.status==='sold_out'){
  st.packs[key]={section:si,bin:ri+1,game:r.gameNumber,pack:r.packNumber,name:r.ticketName||'',assignedAt:new Date().toISOString()};
  st.stock[key].status='in_bin';st.stock[key].section=si;st.stock[key].bin=ri+1;
  delete st.stock[key].soldOutAt;
 }
 r.binEmpty=false;delete r.soldOutUndo;
 st.history.unshift({at:new Date().toISOString(),mode:'undo_accidental_sold_out',sheetId:sheet().id,section:si,bin:ri+1,game:r.gameNumber||'',pack:r.packNumber||''});
 saveSoon();drawRows();updateStatsDisplay();showToast('Sold Out undone for '+explainBin(si,ri)+'. Verify the End # before continuing.');
 return true
}
function retireBinPack(si,ri){

  if(p.section!==si||p.bin!==ri+1)continue;
  if(!st.stock[key])st.stock[key]={game:p.game,pack:p.pack,name:p.name||'',receivedAt:p.assignedAt||new Date().toISOString(),source:'old-bin'};
  st.stock[key].status='sold_out';st.stock[key].soldOutAt=new Date().toISOString();
  delete st.packs[key];
 }
}

function restockSoldOutBin(si,ri,key,startRaw,endRaw){
 let r=row(si,ri),st=scannerState(),p=st.stock[key];
 if(!r||!(r.binEmpty||isBinVacant(si,ri)))return showToast('Choose a sold-out or empty bin.');
 if(!p||p.status!=='available'){showToast('That roll is no longer available. Reopen inventory.');drawRows();return}
 let start=Number(startRaw),end=Number(endRaw);
 if(!String(startRaw).trim()||!String(endRaw).trim()||!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start<0||end<0||end>start){showToast('Enter valid Start and End numbers; End cannot exceed Start.');return}
 if(st.packs[key]){showToast('This pack is already assigned to another bin.');return}

 const expected=rollStartForPrice(actualPrice);
 if(expected!==null&&start!==expected&&!confirm('A $'+actualPrice+' roll normally starts at #'+String(expected).padStart(3,'0')+' and ends at #000.\n\nYou entered #'+String(start).padStart(3,'0')+'. Only continue if the physical roll uses a different range.'))return;
 let priorStart=r.binEmpty?effectiveStart(data.current,si,ri):null;
 if(r.binEmpty&&(priorStart===null||!Number.isSafeInteger(priorStart)||priorStart<0)){showToast('The sold-out roll needs a valid prior Start number.');return}

 if(oldName&&!namesMatch(oldName,newName)&&!confirm('Replace '+oldName+' with '+newName+' in this bin? Previous sold-out sales will be kept.'))return;
 if(!Array.isArray(r.closures))r.closures=[];
 if(r.binEmpty){let priorCount=priorStart+1;
 r.closures.push({kind:'sold_roll',count:priorCount,total:priorCount*(safeNum(r.price)||0),game:r.gameNumber||'',pack:r.packNumber||'',name:oldName||'',start:priorStart,end:0,closedAt:new Date().toISOString()});}
 if(oldName&&!namesMatch(oldName,newName))r.photoId=null;
 r.ticketName=newName;r.gameNumber=p.game;r.packNumber=p.pack;
 const incomingPrice=safeNum(info?.price)??safeNum(p.price);r.price=incomingPrice;
 r.start=start;r.end=end;r.overrideStart=true;r.binEmpty=false;delete r.soldOutUndo;r.lastScanSerial='';
 st.packs[key]={section:si,bin:ri+1,game:p.game,pack:p.pack,name:newName,assignedAt:new Date().toISOString()};
 p.status='in_bin';p.section=si;p.bin=ri+1;p.placedAt=new Date().toISOString();
 rememberTicketSetup(si,ri,r,['ticketName','price','photoId']);saveSoon();renderSheets();showToast(newName+' · Pack '+p.pack+' loaded into '+explainBin(si,ri)+'. '+availableRolls(p.game)+' unopened roll(s) remain.');
}

// Inventory scan -> choose BIN -> automatically fill matching ticket details.
let inventoryScannedDraft=null;
function inventoryScannedDetails(d){
 const key=packKey(d.game,d.pack),p=inventoryStock()[key],info=gameByNumber(d.game)||d.gameInfo||{};
 const price=safeNum(info.price)??safeNum(p?.price),official=verifiedHoosierPackInfo(d.game),start=safeNum(p?.verifiedStart)??suggestedRollStart(d.game,price),end=Number(d.ticket);
 const packVerified=safeNum(p?.verifiedStart)!==null,priorGameStart=safeNum(scannerState().verifiedStartByGame?.[String(d.game)]);

 const name=String(catalogGame?.name||p?.name||'Game #'+d.game);

function loadScannedTicketToBin(d,si,ri,startRaw,endMode='new',customName='',customPriceRaw=''){
 const st=scannerState(),info=inventoryScannedDetails(d),{key,p,price}=info;
 const input=String(startRaw??'').trim(),start=/^\d{1,3}$/.test(input)?Number(input):null;
 const end=endMode==='scanned'?Number(d.ticket):start;
 if(!p||p.status!=='available'||st.packs[key])return showToast('Pack already assigned or unavailable. Scan again.');
 if(!inventoryTargetBins().some(x=>x.si===si&&x.ri===ri))return showToast('BIN is no longer empty. Select another BIN.');
 if(!['new','scanned'].includes(endMode))return showToast('Select New pack or Already selling.');
 if(!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start<end||end<0||start>999)return showToast('Check Start # and scanned ticket number. End cannot exceed Start.');
 if(!Number.isSafeInteger(Number(d.ticket))||Number(d.ticket)<0||Number(d.ticket)>start)return showToast('Scanned ticket # is outside the verified Start # range.');
 let verifiedName=info.name,verifiedPrice=price;
 if(!info.catalogMatch){
  verifiedName=String(customName||'').trim();verifiedPrice=Number(String(customPriceRaw??'').trim());
  if(!verifiedName||verifiedName.length>75||/^Game #\d{4}$/i.test(verifiedName)||!Number.isFinite(verifiedPrice)||verifiedPrice<=0||verifiedPrice>100)return showToast('Enter the exact printed ticket game name and price.');
 }
 const oldRow=row(si,ri),priorName=oldRow.ticketName;
 if(!confirm('Load '+verifiedName+' · Game #'+d.game+' · Pack '+d.pack+' into '+explainBin(si,ri)+'?\n\nConfirmed Start #'+String(start).padStart(3,'0')+' · End #'+String(end).padStart(3,'0')+'.\n'+(endMode==='scanned'?'Scanned ticket is LAST unsold: '+(start-end)+' sold.':'New pack: zero sales recorded.')+'\n\nTicket price '+usd(verifiedPrice)+'. Existing BINs will not be overwritten.'))return;
 const oldStock={name:p.name,price:p.price},previousCatalog=Object.prototype.hasOwnProperty.call(st.catalog,d.game)?{...st.catalog[d.game]}:null;
 if(!info.catalogMatch){
  st.catalog[d.game]={number:d.game,name:verifiedName,price:verifiedPrice,source:'Store-entered ticket details, not verified by Hoosier Lottery'};
  p.name=verifiedName;p.price=verifiedPrice;
 }
 restockSoldOutBin(si,ri,key,String(start),String(end));
 if(st.stock[key]?.status!=='in_bin'||st.packs[key]?.section!==si||st.packs[key]?.bin!==ri+1){
  if(!info.catalogMatch){if(previousCatalog)st.catalog[d.game]=previousCatalog;else delete st.catalog[d.game];p.name=oldStock.name;p.price=oldStock.price}
  return;
 }
 oldRow.ticketName=verifiedName;oldRow.price=verifiedPrice;
 if(priorName&&!namesMatch(priorName,verifiedName))oldRow.photoId=null;
 rememberTicketSetup(si,ri,oldRow,['ticketName','price','photoId']);
 oldRow.lastScanSerial=d.game+'-'+d.pack+'-'+d.ticket;
 p.verifiedStart=start;p.verifiedStartAt=new Date().toISOString();
 if(!st.verifiedStartByGame||typeof st.verifiedStartByGame!=='object')st.verifiedStartByGame={};
 st.verifiedStartByGame[String(d.game)]=start;
 inventoryScannedDraft=null;saveSoon();
 section=si;setView('sheets');
 showToast('Game '+d.game+' · Pack '+d.pack+' loaded in '+explainBin(si,ri)+' with Start #'+String(start).padStart(3,'0')+' and End #'+String(end).padStart(3,'0')+'.');
 setTimeout(()=>document.querySelector('.ticket[data-row="'+ri+'"]')?.scrollIntoView({behavior:'smooth',block:'center'}),90);
}

function receiveInventoryScan(raw,format=''){
 scanRaw=String(raw||'').trim();
 const d=decodeInventorySerial(scanRaw,format);
 if(d.error){inventoryMessage={error:true,text:d.error};inventoryScannedDraft=null;renderInventory();return}
 scanAcknowledged(d);
 const st=scannerState(),key=packKey(d.game,d.pack),old=st.stock[key],linked=st.packs[key];
 if(old){
  inventoryMessage={error:false,text:'Pack '+d.pack+' already recorded ('+(old.status==='available'?'available — select BIN below':old.status==='in_bin'?'already loaded in a BIN':old.status==='returned'?'returned':'Sold Out')+').'};
  if(old.status==='available'){
   old.lastScannedTicket=d.ticket;old.lastScanSerial=d.raw;old.lastScannedAt=new Date().toISOString();
   if(!old.name&&d.gameInfo?.name)old.name=d.gameInfo.name;
   if(safeNum(old.price)===null&&safeNum(d.gameInfo?.price)!==null)old.price=d.gameInfo.price;
   saveSoon();
  }
 }else{
  st.stock[key]={game:d.game,pack:d.pack,name:d.gameInfo?.name||'',price:safeNum(d.gameInfo?.price),status:linked?'in_bin':'available',receivedAt:new Date().toISOString(),source:'barcode',lastScannedTicket:d.ticket,lastScanSerial:d.raw,lastScannedAt:new Date().toISOString()};
  inventoryMessage={error:false,text:'Ticket barcode saved. Select the BIN below to load the full ticket details.'};
  saveSoon();
 }
 inventoryScannedDraft=d;
 renderInventory();
 openScannedInventoryLoad(d);
}

 const r=data.sheets[wi]?.sections?.[si]?.[ri];

function recoverSoldOutInventoryPack(key){
 const st=scannerState(),p=st.stock[key];
 if(!p||p.status!=='sold_out')return showToast('This pack is no longer marked Sold Out.');
 const refs=data.sheets.flatMap((sh,wi)=>(sh.sections||[]).flatMap((rows,si)=>(rows||[]).flatMap((r,ri)=>String(r?.gameNumber||'')===String(p.game)&&String(r?.packNumber||'')===String(p.pack)?[{wi,si,ri,r}]:[]))).reverse();
 const closed=refs.find(x=>x.r.binEmpty);
 if(closed){undoSoldOutFromSheet(closed.wi,closed.si,closed.ri);return}
 const active=refs.find(x=>x.wi===data.sheets.length-1&&!x.r.binEmpty);
 if(active){
  const mapped=Object.entries(st.packs).find(([k,m])=>m.section===active.si&&m.bin===active.ri+1);
  if(st.packs[key]||mapped)return showToast('This pack or BIN has a different assignment. Check the BIN before restoring.');
  if(!confirm('Restore pack '+p.pack+' in Section '+(active.si+1)+' BIN '+(active.ri+1)+'? This will correct inventory without changing sales totals.'))return;
  st.packs[key]={section:active.si,bin:active.ri+1,game:p.game,pack:p.pack,name:active.r.ticketName||p.name||'',assignedAt:new Date().toISOString()};
  p.status='in_bin';p.section=active.si;p.bin=active.ri+1;delete p.soldOutAt;
  st.history.unshift({at:new Date().toISOString(),mode:'correct_sold_out_inventory',sheetId:data.sheets[active.wi].id,section:active.si,bin:active.ri+1,game:p.game,pack:p.pack});
  saveSoon();data.current=active.wi;section=active.si;query='';setView('sheets');

function guideList(si,ri){

 for(let s=si;s<sections.length;s++)for(let i=s===si?ri:0;i<sections[s].length;i++){

  if(r.ticketName||r.gameNumber||r.packNumber||effectiveStart(data.current,s,i)!==null||assigned.some(p=>p.section===s&&p.bin===i+1))out.push({si:s,ri:i});
 }
 return out;
}
function guideExpected(si,ri){
 const r=row(si,ri),p=Object.values(scannerState().packs).find(x=>x.section===si&&x.bin===ri+1);
 return{game:String(r?.gameNumber||p?.game||''),pack:String(r?.packNumber||p?.pack||''),name:r?.ticketName||p?.name||''};

 const code=d.game+'-'+d.pack+'-'+d.ticket;
 if(code===g.lastRead||g.pending)return false;

  guideMessage('Wrong BIN. Pack '+d.pack+' belongs to '+explainBin(mapped.section,mapped.bin-1)+'. Scan '+explainBin(si,ri)+'.',true);return false
 }
 for(let a=0;a<sheet().sections.length;a++)for(let b=0;b<sheet().sections[a].length;b++){
  const other=row(a,b);
  if((a!==si||b!==ri)&&other&&!other.binEmpty&&String(other.gameNumber||'')===d.game&&String(other.packNumber||'')===d.pack){
   guideMessage('Wrong BIN. This pack is already recorded in '+explainBin(a,b)+'.',true);return false

 }
 if(expected.game&&expected.game!==d.game){guideMessage('Wrong game for '+explainBin(si,ri)+'. Expected #'+expected.game+', scanned #'+d.game+'.',true);return false}
 if(expected.pack&&expected.pack!==d.pack){guideMessage('Wrong pack for '+explainBin(si,ri)+'. Expected '+expected.pack+', scanned '+d.pack+'.',true);return false}

  guideMessage('Wrong ticket for '+explainBin(si,ri)+'. Expected '+expected.name+', scanned '+d.gameInfo.name+'.',true);return false
 }
 const check=safeEndRange(si,ri,d.ticket);
 if(check.error&&check.error!=='Enter a valid Start # first.'){guideMessage(check.error,true);return false}
 const historicalStatus=['returned','sold_out'].includes(st.stock[key]?.status)?st.stock[key].status:null;
 if(historicalStatus&&(String(r.gameNumber||'')!==d.game||String(r.packNumber||'')!==d.pack)){

 }

 const unmatched=!expected.game&&!expected.pack&&(!expected.name||!d.gameInfo.catalogMatch||!namesMatch(expected.name,d.gameInfo.name));
 const repeatedGame=!expected.pack&&sheet().sections.some((rows,a)=>rows.some((other,b)=>(a!==si||b!==ri)&&other&&!other.binEmpty&&
 (String(other.gameNumber||'')===d.game||d.gameInfo.catalogMatch&&namesMatch(other.ticketName,d.gameInfo.name))));

   'Confirm game #'+d.game+' / pack '+d.pack+' / ending #'+d.ticket+' belongs to '+explainBin(si,ri)+'.',true);

 }

 logScan(d,si,ri,historicalStatus?'historical-pack-end':'guided-end');
 rememberTicketSetup(si,ri,r,['ticketName','price']);saveSoon();
 g.pending=null;g.error=false;g.pos++;
 const next=g.list[g.pos];
 g.message='✓ '+explainBin(si,ri)+' saved End #'+d.ticket+
  (historicalStatus?' (inventory '+historicalStatus+' status unchanged).':'')+
  (check.error?' (Start # missing; enter it in Ticket Sheets).':'')+

 // Keep the camera running; announce the next BIN and game.

function guideSkip(){

function wireScanInput(onRead){
 const input=$('scanText');if(!input)return;
 let timer=null;
 input.addEventListener('input',()=>{
  if(timer){clearTimeout(timer);timer=null}
  // Barcode guns insert 13 or 14 digits; match actual digits, not literal "\d".
  const digits=input.value.replace(/^\][A-Za-z]\d/,'').replace(/[^0-9]/g,'');
  if(!/^\d{13,14}$/.test(digits))return;
  timer=setTimeout(()=>{
   timer=null;
   if(!input.isConnected)return;
   const d=decodeInventorySerial(input.value);
   if(!d.error)onRead(input.value);
  },digits.length===14?260:600);
 });

const HOOSIER_ITF_PATTERNS=Object.freeze({
 nnwwn:'0',wnnnw:'1',nwnnw:'2',wwnnn:'3',nnwnw:'4',
 wnwnn:'5',nwwnn:'6',nnnww:'7',wnnwn:'8',nwnwn:'9'
});
const hoosierScanCanvas=document.createElement('canvas');
let cameraCandidate='',cameraConfirmations=0,cameraStartedAt=0;
function decodeHoosierItfProfile(profile) {
 if(!profile||profile.length<180)return null;
 const sample=[];
 for(let i=0;i<profile.length;i+=Math.max(1,Math.floor(profile.length/120)))sample.push(profile[i]);
 sample.sort((a,b)=>a-b);
 const low=sample[Math.floor(sample.length*.1)],high=sample[Math.floor(sample.length*.8)];
 const middle=(low+high)/2;
 if(high-low<25)return null;
 const thresholds=[middle,middle-16,middle+16,100,120,140,165,185];
 const attempted=new Set();
 for(let threshold of thresholds) {
  threshold=Math.max(25,Math.min(230,Math.round(threshold)));
  if(attempted.has(threshold))continue;attempted.add(threshold);
  const lengths=[],colors=[];
  let last=profile[0]<threshold?1:0,len=1;
  for(let i=1;i<profile.length;i++){
   let color=profile[i]<threshold?1:0;
   if(color===last)len++;
   else{lengths.push(len);colors.push(last);last=color;len=1}
  }
  lengths.push(len);colors.push(last);
  if(lengths.length<77)continue;
  for(const reverse of [false,true]){
   for(let i=0;i<=lengths.length-77;i++){
    const begin=reverse?lengths.length-1-i:i;
    if(colors[begin]!==1)continue;
    const get=j=>lengths[reverse?begin-j:begin+j];
    const narrow=(get(0)+get(1)+get(2)+get(3))/4;
    if(narrow<1.4||narrow>35)continue;
    if([0,1,2,3].some(j=>get(j)<narrow*.53||get(j)>narrow*1.55))continue;
    const wide=x=>x>narrow*1.8;
    if(!wide(get(74))||wide(get(75))||wide(get(76)))continue;
    let decoded='',valid=true;
    for(let p=0;p<7;p++){
     let bars='',spaces='';
     for(let j=0;j<5;j++){
      bars+=wide(get(4+p*10+j*2))?'w':'n';
      spaces+=wide(get(5+p*10+j*2))?'w':'n';
     }
     if(!(bars in HOOSIER_ITF_PATTERNS)||!(spaces in HOOSIER_ITF_PATTERNS)){valid=false;break}
     decoded+=HOOSIER_ITF_PATTERNS[bars]+HOOSIER_ITF_PATTERNS[spaces];
    }
    if(valid&&/^\d{14}$/.test(decoded))return decoded;
   }
  }
 }
 return null;
}
function decodeHoosierItfImage(source,photo=false) {
 const nativeW=source.videoWidth||source.naturalWidth||source.width;
 const nativeH=source.videoHeight||source.naturalHeight||source.height;
 if(!nativeW||!nativeH)return null;
 const max=photo?1900:1450,ratio=Math.min(1,max/Math.max(nativeW,nativeH));
 const w=Math.max(1,Math.round(nativeW*ratio)),h=Math.max(1,Math.round(nativeH*ratio));
 hoosierScanCanvas.width=w;hoosierScanCanvas.height=h;
 const ctx=hoosierScanCanvas.getContext('2d',{willReadFrequently:true});
 if(!ctx)return null;
 ctx.drawImage(source,0,0,w,h);
 const pixels=ctx.getImageData(0,0,w,h).data;
 const total=photo?95:30;
 // Horizontal scan lines capture bars that run vertically in the image.
 for(let line=0;line<total;line++){
  const y=Math.round((.08+.84*line/Math.max(1,total-1))*(h-1));
  const profile=new Uint8Array(w);
  for(let x=0;x<w;x++){
   const k=(y*w+x)*4;
   profile[x]=((pixels[k]*77+pixels[k+1]*150+pixels[k+2]*29)>>8);
  }
  const code=decodeHoosierItfProfile(profile);
  if(code&&!decodeInventorySerial(code,'itf').error)return code;
 }
 // Portrait and rotated photos can have horizontal bars.
 const verticalTotal=photo?95:30;
 for(let line=0;line<verticalTotal;line++){
  const x=Math.round((.08+.84*line/Math.max(1,verticalTotal-1))*(w-1));
  const profile=new Uint8Array(h);
  for(let y=0;y<h;y++){
   const k=(y*w+x)*4;
   profile[y]=((pixels[k]*77+pixels[k+1]*150+pixels[k+2]*29)>>8);
  }
  const code=decodeHoosierItfProfile(profile);
  if(code&&!decodeInventorySerial(code,'itf').error)return code;
 }
 return null;
}
async function loadLotteryPhoto(file){
 const url=URL.createObjectURL(file);
 try{
  const picture=new Image();
  await new Promise((resolve,reject)=>{
   picture.onload=resolve;
   picture.onerror=()=>reject(new Error('Could not open photo. Try a JPG or PNG image.'));
   picture.src=url;
  });
  return picture;
 }finally{URL.revokeObjectURL(url)}
}


let scanSessionId=0,libraryCameraOpening=false,scanBackend='',lastNativeRead='';
function onCameraBarcode(raw,format=''){
 if(!cameraRunning)return false;
 const d=decodeInventorySerial(raw,format);
 if(d.error)return false;
 if(view==='scanner'&&guidedMode){
  if(!guidedMode.list[guidedMode.pos]||guidedMode.pending)return false;
  // The guided recorder validates pack, game, range, writes the End #, and advances.
  const recorded=guideScan(raw,format);if(recorded)scanAcknowledged(d);return recorded;
 }
 if(!validCameraScan(raw,format))return false;
 if(lastCameraRead===String(raw))return false;
 lastCameraRead=String(raw);scanAcknowledged(d);
 // One-off scans retain their original behavior; continuous BIN scans never stop here.
 void stopCamera().then(()=>acceptScannedCode(raw,format));
 return true;
}

let cameraAssistTimer=null,cameraAssistCandidate='',cameraAssistMatches=0;
function startCameraAssist(){
 if(cameraAssistTimer!==null)return;
 cameraAssistCandidate='';cameraAssistMatches=0;
 const scan=()=>{
  cameraAssistTimer=null;
  if(!cameraRunning)return;
  if(view==='scanner'&&guidedMode&&(!guidedMode.list[guidedMode.pos]||guidedMode.pending)){
   cameraAssistTimer=setTimeout(scan,380);return;
  }
  try{
   const video=scanBackend==='zxing'
    ?document.querySelector('#fallbackCamera video')
    :$('cameraVideo');
   if(video&&video.readyState>=2&&video.videoWidth>0&&video.videoHeight>0){
    const decoded=decodeHoosierItfImage(video,false);
    if(decoded&&!decodeInventorySerial(decoded,'itf').error){
     if(decoded===cameraAssistCandidate)cameraAssistMatches++;
     else{cameraAssistCandidate=decoded;cameraAssistMatches=1}
     if(cameraAssistMatches>=2){
      cameraAssistMatches=0;
      cameraAssistCandidate='';
      onCameraBarcode(decoded,'itf');
     }
    }else{
     cameraAssistCandidate='';
     cameraAssistMatches=0;
    }
   }
  }catch(e){}
  if(cameraRunning)cameraAssistTimer=setTimeout(scan,230);
 };
 cameraAssistTimer=setTimeout(scan,150);
}

async function startLibraryCamera(token,transition=false){
 if(libraryCameraOpening)return;
 libraryCameraOpening=true;
 let reader;
 try{
  const hint=$('cameraHint');
  if(hint)hint.textContent='Starting barcode reader (ITF / Code 128)…';
  await loadScannerLibrary();
  if(token!==scanSessionId)return;
  // Do not reset the guided BIN state when changing scanner engines.
  if(cameraLoop){clearTimeout(cameraLoop);cameraLoop=null}
  cameraDetector=null;
  if(cameraStream){
   for(const track of cameraStream.getTracks())track.stop();
   cameraStream=null;
  }
  const frame=$('scannerWindow');
  if(!frame)throw Error('Camera panel closed');
  frame.innerHTML='<div id="fallbackCamera"></div>'+
   '<div id="guidedCameraBadge" class="guided-camera-badge" hidden></div>'+
   '<p id="cameraHint">Aim at the long inventory barcode and hold it steady.</p>';
  const f=window.Html5QrcodeSupportedFormats;
  const formats=f?[f.ITF,f.CODE_128,f.CODE_39]:undefined;
  reader=new Html5Qrcode('fallbackCamera',{
   ...(formats?{formatsToSupport:formats}:{}),
   useBarCodeDetectorIfSupported:false
  });
  cameraReader=reader;
  await reader.start(
   {facingMode:'environment'},
   // Full image scanning is important: the Hoosier barcode is wider than a QR code.
   {fps:12},
   (value,result)=>{
    if(token!==scanSessionId||!cameraRunning)return;
    if(view==='scanner'&&guidedMode?.pending)return;
    const format=result?.result?.format?.formatName||'itf';
    onCameraBarcode(value,format);
   },
   ()=>{}
  );
  if(token!==scanSessionId){
   try{await reader.stop()}catch(e){}
   try{await reader.clear()}catch(e){}
   return;
  }
  cameraRunning=true;scanBackend='zxing';startCameraAssist();
  if($('stopCamera'))$('stopCamera').disabled=false;
  const h=$('cameraHint');
  if(h)h.textContent='Scanner ON. Barcode detection is active. Hold the entire long barcode steady, including both ends.';
  if(view==='scanner')renderGuided();
 }catch(e){
  if(token===scanSessionId){
   const msg=String(e?.message||e);
   await stopCamera();
   const hint=$('cameraHint');
   if(hint)hint.textContent='Barcode reader failed: '+msg+'. Check camera permission, then try again.';
  }
 }finally{libraryCameraOpening=false}
}

async function stopCamera(){
 scanSessionId++;scanBackend='';
 if(cameraAssistTimer!==null){clearTimeout(cameraAssistTimer);cameraAssistTimer=null}
 cameraAssistCandidate='';cameraAssistMatches=0;
 cameraRunning=false;cameraDetector=null;cameraCandidate='';cameraConfirmations=0;
 if(cameraLoop){clearTimeout(cameraLoop);cameraLoop=null}
 if(cameraReader){try{await cameraReader.stop()}catch(e){}try{await cameraReader.clear()}catch(e){}cameraReader=null}
 if(cameraStream){for(let track of cameraStream.getTracks())track.stop();cameraStream=null}
 const frame=$('scannerWindow'),video=$('cameraVideo');
 if(frame&&!video){frame.innerHTML='<video id="cameraVideo" muted playsinline autoplay aria-label="Ticket barcode camera"></video><div class="scan-reticle" aria-hidden="true"></div><div id="guidedCameraBadge" class="guided-camera-badge" hidden></div><p id="cameraHint">Camera stopped. Tap Start camera to scan again.</p>';}
 else if(video){try{video.pause();video.srcObject=null;video.style.display=''}catch(e){}}
 if($('stopCamera'))$('stopCamera').disabled=true;
 if($('startCamera'))$('startCamera').disabled=false;
}
async function startCamera(){
 if(cameraRunning||libraryCameraOpening)return;
 lastCameraRead='';lastNativeRead='';cameraCandidate='';cameraConfirmations=0;
 const btn=$('startCamera'),hint=$('cameraHint');
 if(!btn||!hint)return;
 if(!navigator.mediaDevices?.getUserMedia){
  hint.textContent='Camera unavailable. Open this site directly in Safari or Chrome and allow camera access.';
  return;
 }
 const token=++scanSessionId;
 btn.disabled=true;
 hint.textContent='Opening camera…';
 try{
  let nativeITF=false;
  if('BarcodeDetector' in window){
   try{
    const formats=await BarcodeDetector.getSupportedFormats();
    nativeITF=Array.isArray(formats)&&formats.includes('itf');
   }catch(e){}
  }
  if(token!==scanSessionId)return;
  if(!nativeITF){
   // On Safari and other browsers without native ITF, use the original ZXing reader.
   await startLibraryCamera(token);
   return;
  }
  const video=$('cameraVideo');
  if(!video){await startLibraryCamera(token);return}
  cameraDetector=new BarcodeDetector({formats:['itf']});
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false
  });
  if(token!==scanSessionId){for(const t of cameraStream.getTracks())t.stop();cameraStream=null;return}
  video.srcObject=cameraStream;
  video.muted=true;video.setAttribute('playsinline','');
  await video.play();
  if(token!==scanSessionId)return;
  cameraRunning=true;scanBackend='native';cameraStartedAt=Date.now();startCameraAssist();
  if($('stopCamera'))$('stopCamera').disabled=false;
  hint.textContent='Scanner ON. Aim at the entire long barcode, including both ends. The next BIN follows automatically.';
  void cameraFrames();
 }catch(e){
  if(token===scanSessionId){
   // If the browser's native detector cannot start, try the earlier ZXing decoder.
   const h=$('cameraHint');if(h)h.textContent='Trying alternate barcode reader…';
   if(cameraStream){for(const t of cameraStream.getTracks())t.stop();cameraStream=null}
   cameraDetector=null;
   await startLibraryCamera(token);
  }
 }finally{if(!cameraRunning&&btn.isConnected)btn.disabled=false}
}


function loadScannerLibrary(){
 if(window.Html5Qrcode)return Promise.resolve();
 if(window.html5Loading)return window.html5Loading;
 const srcs=['https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js','https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js','https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'];
 window.html5Loading=new Promise((resolve,reject)=>{
  const load=i=>{
   if(i>=srcs.length){window.html5Loading=null;reject(new Error('Barcode reader script could not load'));return}
   const script=document.createElement('script');script.src=srcs[i];
   script.onload=()=>window.Html5Qrcode?resolve():load(i+1);
   script.onerror=()=>{script.remove();load(i+1)};
   document.head.appendChild(script);
  };load(0);
 });
 return window.html5Loading;
}
function validCameraScan(value,format=''){
 const d=decodeInventorySerial(value,format),hint=$('cameraHint');
 if(d.error){if(hint)hint.textContent='Try the 14-digit barcode on the BACK of the ticket.';return false}
 if(view==='sheets'&&pendingOperation){
  const p=pendingOperation,r=row(p.si,p.ri);
  if(p.kind==='restock'&&$('restockPack')?.value!==packKey(d.game,d.pack)){if(hint)hint.textContent='Scan the selected pack.';return false}
  if(p.kind!=='restock'&&r&&((r.gameNumber&&String(r.gameNumber)!==d.game)||(r.packNumber&&String(r.packNumber)!==d.pack))){if(hint)hint.textContent='Wrong pack or game. Keep scanning this bin’s ticket.';return false}
 }
 return true;
}
async function cameraFrames(){
 if(!cameraRunning||scanBackend!=='native'||!cameraDetector)return;
 try{
  const video=$('cameraVideo');
  if(video&&video.readyState>=2){
   const found=await cameraDetector.detect(video);
   const match=found.find(x=>x.rawValue&&!decodeInventorySerial(x.rawValue,x.format||'itf').error);
   if(match&&match.rawValue){
    const code=String(match.rawValue);
    // Confirm two adjacent frames before accepting native reads.
    if(cameraCandidate===code)cameraConfirmations++;
    else{cameraCandidate=code;cameraConfirmations=1}
    if(cameraConfirmations>=2){
     cameraCandidate='';cameraConfirmations=0;
     if(onCameraBarcode(code,match.format||'itf'))lastNativeRead=code;
    }
   }
   // Native ITF can report as supported yet fail to decode actual ticket bars.
   // Switch to the original cross-browser barcode engine without closing the session.
   if(cameraRunning&&scanBackend==='native'&&!libraryCameraOpening&&
      Date.now()-cameraStartedAt>8500&&
      (!guidedMode||guidedMode.list[guidedMode.pos])&&lastNativeRead===''){
    const hint=$('cameraHint');
    if(hint)hint.textContent='Trying enhanced barcode detection while keeping the same scan session…';
    void startLibraryCamera(scanSessionId,true);
   }
  }
 }catch(e){}
 if(cameraRunning&&scanBackend==='native'&&cameraDetector)cameraLoop=setTimeout(cameraFrames,180);
}

function posParse(t){
 const text=String(t||"").replace(/\u00a0/g," ").replace(/[‐‑–—]/g,"-");
 const parseAmount=s=>{const v=String(s??"").trim();if(!v)return NaN;const n=Number(v.replace(/[$,\s()%]/g,"").replace(/^[+]/,""));return Number.isFinite(n)?(/^\s*\(/.test(v)?-Math.abs(n):n):NaN};
 const normLine=s=>String(s||"").replace(/[|¦]/g,"|").replace(/\b[Oo]\s*[.,]\s*[Oo0]{2}\b/g,"0.00").replace(/\b[Oo](?=[.,]\s*\d{2})/g,"0").replace(/(\d)\s*\.\s*(\d{2})(?=\D|$)/g,"$1.$2").replace(/\s+/g," ").trim();
 const amounts=line=>{
   const s=normLine(line),out=[];
   const rx=/\(?\s*-?\$?\s*\d[\d,]*[.,]\s*\d{2}\s*\)?/g;
   for(const m of s.matchAll(rx)){
     if(/^\s*%/.test(s.slice(m.index+m[0].length)))continue;
     const token=m[0].replace(/\s+/g,"").replace(/,(\d{2})$/,".$1");
     const value=parseAmount(token);
     if(Number.isFinite(value))out.push(value);
   }return out;
 };
 const firstHeader=/^\s*[|:;.\-]*\s*(?:24|2\s*4|2A|Z4)\s+(?:[Ii1l|!]NSTANT)(?:\s*[/\\|]\s*[LlI1|])?\b/i;
 const otherDept=/^\s*\d{1,3}\s+[A-Za-z][A-Za-z\/ -]{2,}/i;
 const out=[];
 const csvLines=text.split(/\r\n?|\n/);
 const csvHeader=csvLines.find(x=>/\b(?:dept|department|description)\b/i.test(x)&&/net\s*sales/i.test(x)&&x.includes(","));
 if(csvHeader){
   const parseCsv=s=>{const cells=[];let value="",quoted=false;for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='"'){if(quoted&&s[i+1]==='"'){value+='"';i++}else quoted=!quoted;}else if(ch===","&&!quoted){cells.push(value.trim());value="";}else value+=ch;}cells.push(value.trim());return cells;};
   const names=parseCsv(csvHeader);
   const index=re=>names.findIndex(s=>re.test(s));
   const indexes={gross:index(/\bgross\b/i),refund:index(/\brefunds?\b/i),discount:index(/\bdiscounts?\b/i),net:index(/\bnet\s*sales\b/i),cust:index(/\b(?:customers?|cust)\b/i),items:index(/\bitems\b/i),share:index(/\b(?:share|percent|%)\b/i)};
   for(const raw of csvLines){
     const cell=parseCsv(raw);if(!cell.some(Boolean)||!cell.some(s=>/^24$/.test(s))||!cell.some(s=>/INSTANT/i.test(s)))continue;
     const n=k=>indexes[k]<0?NaN:parseAmount(cell[indexes[k]]);
     let values=[n("gross"),n("refund"),n("discount"),n("net")];
     if(!values.every(Number.isFinite)){values=cell.slice(-4).map(parseAmount);}
     if(!values.every(Number.isFinite))continue;
     const [gross,refund,discount,net]=values;
     const optional=k=>Number.isFinite(n(k))?n(k):null;
     out.push({departmentNumber:24,departmentName:"INSTANT/L",customers:optional("cust"),items:optional("items"),share:optional("share"),gross,refund,discount,net,line:raw.slice(0,350)});
   }
   if(out.length)return out.slice(0,40);
 }
 const lines=csvLines.map(normLine).filter(Boolean);
 for(let i=0;i<lines.length;i++){
   const line=lines[i],head=line.match(firstHeader);
   if(!head)continue;
   const rest=line.slice(head[0].length).trim();
   const meta=rest.match(/^(\d{1,6})\s+(\d+(?:[.,]\d{1,2})?)\s+(\d+(?:[.,]\d{1,2})?)\s*%?/);
   const customers=meta?parseAmount(meta[1]):NaN;
   const items=meta?parseAmount(meta[2].replace(/,(\d{1,2})$/,".$1")):NaN;
   const share=meta?parseAmount(meta[3].replace(/,(\d{1,2})$/,".$1")):NaN;
   let values=null,source=line;
   const inLine=amounts(meta?rest.slice(meta[0].length):rest);
   if(inLine.length>=4)values=inLine.slice(-4);
   if(!values){
     for(let offset=1;offset<=2 && i+offset<lines.length;offset++){
       const next=lines[i+offset];
       if(firstHeader.test(next)||otherDept.test(next)||/\b(?:grand total|department total|subtotal|tender total)\b/i.test(next))break;
       const nums=amounts(next);
       if(nums.length===4){values=nums;source+=" | "+next;break;}
       if(offset===1 && nums.length>0)break;
     }
   }
   if(!values){
     const nearby=lines.slice(i+1,i+3);
     for(const [k,next]of nearby.entries()){
       if(firstHeader.test(next)||otherDept.test(next))break;
       const joined=amounts((meta?rest.slice(meta[0].length):rest)+" "+next);
       if(joined.length>=4){values=joined.slice(-4);source+=" | "+next;break;}
       if(k===0 && amounts(next).length===0)continue;
     }
   }
   if(!values||values.length!==4||!values.every(Number.isFinite))continue;
   const [gross,refund,discount,net]=values;
   out.push({departmentNumber:24,departmentName:"INSTANT/L",customers:Number.isFinite(customers)?customers:null,items:Number.isFinite(items)?items:null,share:Number.isFinite(share)?share:null,gross,refund,discount,net,line:source.slice(0,350)});
 }
 return out.slice(0,40);
}
